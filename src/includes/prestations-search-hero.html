<section class="prestations-search-hero prestations-search-hero--wow" aria-label="Rechercher une offre">
    <div class="prestations-search-bg" aria-hidden="true">
        <svg class="prestations-search-bg-svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="psh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#e8f6fc"/>
                    <stop offset="45%" stop-color="#dff8f8"/>
                    <stop offset="100%" stop-color="#e8f8ef"/>
                </linearGradient>
                <linearGradient id="psh-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2f9e6a"/>
                    <stop offset="100%" stop-color="#4da9d6"/>
                </linearGradient>
                <radialGradient id="psh-orb-a" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#7bcde3" stop-opacity="0.55"/>
                    <stop offset="100%" stop-color="#7bcde3" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="psh-orb-b" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#91b98a" stop-opacity="0.45"/>
                    <stop offset="100%" stop-color="#91b98a" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <rect width="1440" height="420" fill="url(#psh-grad)"/>
            <circle class="prestations-search-orb prestations-search-orb--1" cx="220" cy="120" r="140" fill="url(#psh-orb-a)"/>
            <circle class="prestations-search-orb prestations-search-orb--2" cx="1180" cy="280" r="160" fill="url(#psh-orb-b)"/>
            <circle class="prestations-search-orb prestations-search-orb--3" cx="720" cy="60" r="100" fill="url(#psh-orb-a)" opacity="0.7"/>
            <path class="prestations-search-wave" d="M0 340 C240 280 480 380 720 330 S1200 260 1440 310 L1440 420 L0 420 Z" fill="#c9f4f2" opacity="0.35"/>
            <path class="prestations-search-wave prestations-search-wave--2" d="M0 360 C320 320 520 390 760 350 S1120 300 1440 340 L1440 420 L0 420 Z" fill="#7bcde3" opacity="0.18"/>
            <g class="prestations-search-leaves">
                <path class="prestations-search-leaf prestations-search-leaf--1" d="M180 90c-8 28 6 48 18 58-14-6-32-22-18-58z" fill="url(#psh-leaf)" opacity="0.75"/>
                <path class="prestations-search-leaf prestations-search-leaf--2" d="M1260 70c10 32-4 52-20 62 16-8 34-28 20-62z" fill="url(#psh-leaf)" opacity="0.6"/>
                <path class="prestations-search-leaf prestations-search-leaf--3" d="M1050 320c-12 24 2 40 14 48-12-4-26-18-14-48z" fill="url(#psh-leaf)" opacity="0.5"/>
            </g>
        </svg>
    </div>

    <div class="container prestations-search-inner">
        <h1 class="prestations-search-title" itemprop="name">Catalogue de services digitaux</h1>
        <p class="prestations-search-lead" itemprop="description">Des solutions sur-mesure pour développer votre présence en ligne · tarifs HT · devis par e-mail.</p>
        <form class="prestations-search-form" role="search" aria-label="Recherche dans le catalogue des offres">
            <label class="visually-hidden" for="prestationsSearchInput">Rechercher une offre</label>
            <div class="prestations-search-input-wrapper" id="prestationsSearchWrapper">
                <i class="fas fa-search prestations-search-icon" aria-hidden="true"></i>
                <input
                    type="search"
                    id="prestationsSearchInput"
                    class="prestations-search-input"
                    name="q"
                    placeholder="Rechercher une offre, un besoin, un mot-clé…"
                    autocomplete="off"
                    enterkeyhint="search"
                >
                <button type="button" id="prestationsSearchClear" class="prestations-search-clear" aria-label="Effacer la recherche" hidden>
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <span class="prestations-search-kbd" aria-hidden="true">/</span>
            </div>
        </form>

        <div class="prestations-search-chips" role="group" aria-label="Filtrer par thème">
            <button type="button" class="prestations-search-chip is-active" data-prestations-search-chip="tous" data-prestations-search-query="" aria-pressed="true"><i class="fas fa-th-large" aria-hidden="true"></i> Tous les services</button>
            <button type="button" class="prestations-search-chip" data-prestations-search-chip="site" data-prestations-search-query="site vitrine"><i class="fas fa-globe" aria-hidden="true"></i> Site vitrine</button>
            <button type="button" class="prestations-search-chip" data-prestations-search-chip="seo" data-prestations-search-query="seo"><i class="fas fa-search" aria-hidden="true"></i> SEO</button>
            <button type="button" class="prestations-search-chip" data-prestations-search-chip="auto" data-prestations-search-query="automatisation"><i class="fas fa-cogs" aria-hidden="true"></i> Automatisation</button>
            <button type="button" class="prestations-search-chip" data-prestations-search-chip="assistant" data-prestations-search-query="assistant"><i class="fas fa-robot" aria-hidden="true"></i> IA</button>
            <button type="button" class="prestations-search-chip" data-prestations-search-chip="entretien" data-prestations-search-query="entretien"><i class="fas fa-shield-alt" aria-hidden="true"></i> Maintenance</button>
            <button type="button" class="prestations-search-chip" data-prestations-search-chip="éco" data-prestations-search-query="éco"><i class="fas fa-leaf" aria-hidden="true"></i> Éco</button>
        </div>

        <p class="prestations-search-results-info" id="prestationsSearchResultsInfo" aria-live="polite"></p>
    </div>
</section>

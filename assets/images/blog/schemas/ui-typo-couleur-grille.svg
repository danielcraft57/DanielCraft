<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">UI typo couleur grille</title>
  <desc id="desc">Trois leviers UI : typographie, couleurs semantiques, grille et espacements</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">UI : typographie - couleurs - grille</text>

  <rect x="40" y="70" width="220" height="250" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Typographie</text>
  <text x="150" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Titre</text>
  <text x="150" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a">Sous-titre</text>
  <text x="150" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Corps 16 / 14</text>
  <text x="150" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Echelle stable</text>
  <text x="150" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">1-2 familles max</text>
  <text x="150" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa">Hierarchie de scan</text>

  <rect x="290" y="70" width="220" height="250" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Couleurs</text>
  <circle cx="340" cy="150" r="16" fill="#2563eb"/>
  <circle cx="380" cy="150" r="16" fill="#64748b"/>
  <circle cx="420" cy="150" r="16" fill="#16a34a"/>
  <circle cx="460" cy="150" r="16" fill="#dc2626"/>
  <text x="400" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">primary - neutral</text>
  <text x="400" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">success - danger</text>
  <text x="400" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Semantique, pas deco</text>
  <text x="400" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa">Contraste lisible</text>

  <rect x="540" y="70" width="220" height="250" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Grille / espaces</text>
  <rect x="570" y="130" width="160" height="20" rx="3" fill="#e2e8f0"/>
  <rect x="570" y="160" width="100" height="20" rx="3" fill="#bfdbfe"/>
  <rect x="680" y="160" width="50" height="20" rx="3" fill="#bfdbfe"/>
  <rect x="570" y="190" width="160" height="20" rx="3" fill="#e2e8f0"/>
  <text x="650" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">4 / 8 / 16 / 24 / 32</text>
  <text x="650" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Alignement = confiance</text>
  <text x="650" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa">Lignes invisibles</text>

  <text x="400" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">Trois leviers pour une hierarchie claire - pas de la decoration</text>
  <text x="400" y="395" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2563eb">Typo guide - couleur signifie - grille aligne</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Registry et secu prod</title>
  <desc id="desc">Scan, signatures, non-root, secrets</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Registry et secu prod</text>
  <rect x="40" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Registry prive</text>
  <text x="155" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Pas Hub public seul</text>
  <rect x="290" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="405" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Scan CVE</text>
  <text x="405" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">A chaque push</text>
  <rect x="540" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Non-root</text>

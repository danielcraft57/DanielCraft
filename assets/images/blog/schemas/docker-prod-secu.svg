  <rect x="40" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="155" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Secrets</text>
  <text x="155" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Pas dans ENV image</text>
  <rect x="290" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="405" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tags immuables</text>
  <text x="405" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Digest sha256</text>

  <rect x="70" y="170" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="210" y="191" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Bind mount</text>
  <rect x="70" y="210" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="210" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">tmpfs</text>
  <rect x="70" y="250" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="210" y="271" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Backup / persist</text>
  <rect x="450" y="130" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="590" y="151" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">bridge</text>

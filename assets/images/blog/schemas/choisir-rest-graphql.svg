<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Choisir REST ou GraphQL</title>
  <desc id="desc">Arbre de decision pour choisir REST ou GraphQL</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Choisir REST ou GraphQL</text>

  <rect x="280" y="60" width="240" height="50" rx="8" fill="#2563eb"/>
  <text x="400" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Besoin clients varies ?</text>

  <!-- Yes branch -->
  <path d="M280 85 H140 V130" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="200" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2563eb">Oui</text>
  <rect x="50" y="135" width="180" height="50" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="140" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Formes de donnees</text>

  <path d="M140 185 V220" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="50" y="225" width="180" height="55" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">' GraphQL</text>

  <!-- No branch -->
  <path d="M520 85 H660 V130" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="580" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2563eb">Non</text>
  <rect x="570" y="135" width="180" height="50" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="660" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">CRUD ressources</text>

  <path d="M660 185 V220" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="570" y="225" width="180" height="55" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">' REST</text>

  <!-- Middle criteria -->
  <rect x="250" y="300" width="300" height="80" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Criteres transverses</text>
  <text x="400" y="355" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Cache HTTP - equipe - tooling - BFF</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

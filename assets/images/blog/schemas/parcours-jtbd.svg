<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Parcours JTBD</title>
  <desc id="desc">Jobs to be done : situation, motivation, resultat</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Parcours JTBD (Jobs To Be Done)</text>

  <rect x="40" y="90" width="200" height="140" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">1. Situation</text>
  <text x="140" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Quand je...</text>
  <text x="140" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">contexte declencheur</text>

  <rect x="300" y="90" width="200" height="140" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">2. Motivation</text>
  <text x="400" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Je veux...</text>
  <text x="400" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">job fonctionnel / emotionnel</text>

  <rect x="560" y="90" width="200" height="140" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">3. Resultat</text>
  <text x="660" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Pour pouvoir...</text>
  <text x="660" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">outcome desire</text>

  <path d="M240 160 H295" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M500 160 H555" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="100" y="280" width="600" height="90" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Exemple</text>
  <text x="400" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Quand je prepare un devis, je veux comparer des options,</text>
  <text x="400" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">pour pouvoir decider rapidement sans risque.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

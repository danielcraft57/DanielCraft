<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Accessibilite WCAG</title>
  <desc id="desc">Quatre principes POUR et niveaux A AA AAA</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Accessibilite WCAG : principes POUR</text>

  <rect x="40" y="70" width="170" height="160" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">P</text>
  <text x="125" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Perceptible</text>
  <text x="125" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Alt text, contrastes</text>
  <text x="125" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Sous-titres</text>

  <rect x="230" y="70" width="170" height="160" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="315" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">O</text>
  <text x="315" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Operable</text>
  <text x="315" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Clavier, focus</text>
  <text x="315" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Pas de pieges</text>

  <rect x="420" y="70" width="170" height="160" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="505" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">U</text>
  <text x="505" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Understandable</text>
  <text x="505" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Labels, erreurs</text>
  <text x="505" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Lecture claire</text>

  <rect x="610" y="70" width="150" height="160" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626">R</text>
  <text x="685" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Robust</text>
  <text x="685" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">HTML valide</text>
  <text x="685" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">ARIA / AT</text>

  <!-- Levels -->
  <text x="400" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Niveaux de conformite</text>

  <rect x="150" y="300" width="140" height="50" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="220" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">A</text>

  <rect x="330" y="300" width="140" height="50" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">AA (cible)</text>

  <rect x="510" y="300" width="140" height="50" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">AAA</text>

  <path d="M290 325 H325" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M470 325 H505" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Tests : clavier, lecteur d'ecran, contraste, automatises + manuels</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Cycle recherche UX</title>
  <desc id="desc">Decouvrir, tester, iterer - boucle de recherche utilisateur</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Recherche UX : decouvrir / tester / iterer</text>

  <!-- Center -->
  <circle cx="400" cy="210" r="48" fill="#2563eb"/>
  <text x="400" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Preuves</text>
  <text x="400" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#fff">pas d'avis</text>

  <!-- Decouvrir -->
  <rect x="60" y="90" width="200" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">1. Decouvrir</text>
  <text x="160" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Interviews, contexte,</text>
  <text x="160" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">taches et contraintes</text>

  <!-- Tester -->
  <rect x="540" y="90" width="200" height="110" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626">2. Tester</text>
  <text x="640" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Prototype + scenario,</text>
  <text x="640" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">observer les frictions</text>

  <!-- Iterer -->
  <rect x="300" y="290" width="200" height="90" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">3. Iterer</text>
  <text x="400" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Corriger, prioriser, retester</text>

  <!-- Arrows -->
  <path d="M260 145 H340" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M460 145 H535" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M640 200 V250 H500" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M300 335 H160 V205" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="400" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">5 utilisateurs pertinents valent mieux qu'un long rapport ignore</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

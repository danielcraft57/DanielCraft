<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Strategies deploy</title>
  <desc id="desc">Rolling, blue/green, canary</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Strategies deploy</text>
  <rect x="40" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Rolling</text>
  <text x="155" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Remplace peu a peu</text>
  <rect x="290" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="405" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Blue/Green</text>
  <text x="405" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Bascule d'un coup</text>
  <rect x="540" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Canary</text>
  <text x="655" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Petit % d'abord</text>
  <rect x="40" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="155" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Rollback</text>
  <text x="155" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Revenir vite</text>
  <rect x="290" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="405" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Health</text>
  <text x="405" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Sondes vivantes</text>
  <rect x="540" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="655" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Traffic</text>
  <text x="655" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Repartition</text>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Choisis selon ton risque et ton trafic</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark performance API</title>
  <desc id="desc">Metriques latence, throughput, erreurs pour REST et GraphQL</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">API perf : axes de benchmark</text>

  <!-- Axes labels -->
  <rect x="60" y="80" width="200" height="100" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Latence</text>
  <text x="160" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">p50 / p95 / p99</text>

  <rect x="300" y="80" width="200" height="100" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Debit</text>
  <text x="400" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">req/s - payload</text>

  <rect x="540" y="80" width="200" height="100" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Erreurs</text>
  <text x="640" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">5xx / timeouts</text>

  <!-- Comparison bars schematic -->
  <text x="80" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Scenario mobile (N ressources)</text>

  <text x="80" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">REST (N appels)</text>
  <rect x="220" y="255" width="420" height="22" rx="4" fill="#60a5fa"/>
  <text x="655" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">RTT x N</text>

  <text x="80" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">GraphQL (1)</text>
  <rect x="220" y="300" width="180" height="22" rx="4" fill="#2563eb"/>
  <text x="415" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">1 RTT</text>

  <rect x="100" y="350" width="600" height="40" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Comparer a iso-charge : cache, N+1 resolvers, taille JSON</text>
</svg>

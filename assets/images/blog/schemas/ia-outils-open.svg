  <rect x="120" y="70" width="560" height="48" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Modele</text>
  <text x="400" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Telecharge / heberge</text>
  <rect x="120" y="128" width="560" height="48" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>

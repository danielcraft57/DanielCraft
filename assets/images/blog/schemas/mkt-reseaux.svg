<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Reseaux sociaux</title>
  <desc id="desc">Etre utile, pas partout</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Reseaux sociaux</text>
  <rect x="40" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Choisir 1-2</text>
  <text x="155" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Pas tous les reseaux</text>
  <rect x="290" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="405" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Rythme</text>
  <text x="405" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Regulier et tenable</text>
  <rect x="540" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Valeur</text>
  <text x="655" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Aider avant de vendre</text>
  <rect x="40" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="155" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Ecouter</text>
  <text x="155" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Commentaires / DM</text>
  <rect x="290" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="405" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Preuves</text>
  <text x="405" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Avis, cas clients</text>
  <rect x="540" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="655" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Mesurer</text>
  <text x="655" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Clics utiles</text>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Mieux vaut un reseau bien tenu que cinq abandonnes</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

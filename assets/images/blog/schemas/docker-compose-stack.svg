<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Stack Compose</title>
  <desc id="desc">Services, networks, volumes, env files</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Stack Compose</text>
  <rect x="120" y="70" width="560" height="48" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">App / API</text>
  <text x="400" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">service web</text>
  <rect x="120" y="128" width="560" height="48" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Workers / jobs</text>
  <text x="400" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">service worker</text>
  <rect x="120" y="186" width="560" height="48" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">DB / cache</text>
  <text x="400" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">postgres, redis</text>
  <rect x="120" y="244" width="560" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Networks + volumes</text>
  <text x="400" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">isole et persiste</text>
  <rect x="120" y="302" width="560" height="48" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">.env / overrides</text>
  <text x="400" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">dev vs staging</text>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Compose = contrat local reproductible, pas une usine a gaz</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Tester l'accessibilite</title>
  <desc id="desc">Auto, clavier, lecteur d'ecran, utilisateurs</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Tester l'accessibilite</text>
  <rect x="40" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Auto</text>
  <text x="155" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">axe, Lighthouse</text>
  <rect x="290" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="405" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Clavier</text>
  <text x="405" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Tab, Esc, focus</text>
  <rect x="540" y="80" width="230" height="110" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">SR</text>
  <text x="655" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">NVDA / VoiceOver</text>
  <rect x="40" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="155" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Contraste</text>
  <text x="155" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">AA minimum</text>
  <rect x="290" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="405" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Formulaires</text>
  <text x="405" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Labels, erreurs</text>
  <rect x="540" y="210" width="230" height="110" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="655" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Humains</text>
  <text x="655" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Tests reels</text>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">L'auto trouve 30-40%. Le reste = clavier + humains</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>

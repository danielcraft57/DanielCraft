<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Niveaux de fidelite wireframe</title>
  <desc id="desc">Low-fi, mid-fi et high-fi</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Wireframes : niveaux de fidelite</text>

  <!-- Low -->
  <rect x="40" y="80" width="220" height="260" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Low-fi</text>
  <rect x="70" y="130" width="160" height="20" rx="3" fill="#e2e8f0"/>
  <rect x="70" y="165" width="160" height="60" rx="3" fill="#e2e8f0"/>
  <rect x="70" y="240" width="70" height="24" rx="3" fill="#cbd5e1"/>
  <rect x="150" y="240" width="70" height="24" rx="3" fill="#cbd5e1"/>
  <text x="150" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Structure rapide</text>
  <text x="150" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Papier / blocs gris</text>

  <!-- Mid -->
  <rect x="290" y="80" width="220" height="260" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Mid-fi</text>
  <rect x="320" y="130" width="160" height="18" rx="3" fill="#60a5fa" opacity="0.5"/>
  <text x="330" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Titre ecran</text>
  <text x="330" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">Texte placeholder...</text>
  <rect x="320" y="220" width="100" height="28" rx="4" fill="#2563eb"/>
  <text x="370" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#fff">CTA</text>
  <text x="400" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Hierarchie claire</text>
  <text x="400" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Peu de style</text>

  <!-- High -->
  <rect x="540" y="80" width="220" height="260" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">High-fi</text>
  <rect x="570" y="130" width="160" height="18" rx="3" fill="#2563eb"/>
  <text x="580" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Titre brandé</text>
  <text x="580" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#0f172a">Copy reelle - icones</text>
  <rect x="570" y="220" width="110" height="30" rx="6" fill="#dc2626"/>
  <text x="625" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#fff">Valider</text>
  <text x="650" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Pixels / design system</text>
  <text x="650" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Pret pour handoff</text>

  <path d="M260 210 H285" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M510 210 H535" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="400" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Plus on avance, plus le cout de changement augmente</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">GraphQL schema et resolvers</title>
  <desc id="desc">Schema types, query, resolvers et sources de donnees</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">GraphQL : schema et resolvers</text>

  <rect x="40" y="80" width="200" height="200" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Schema</text>
  <text x="140" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">type User</text>
  <text x="140" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">type Order</text>
  <text x="140" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Query / Mutation</text>
  <text x="140" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Subscriptions</text>
  <text x="140" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa">contrat API</text>

  <rect x="300" y="80" width="200" height="200" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Resolvers</text>
  <text x="400" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">user(id)</text>
  <text x="400" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">User.orders</text>
  <text x="400" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">createOrder()</text>
  <text x="400" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">DataLoader</text>
  <text x="400" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa">logique d'acces</text>

  <rect x="560" y="80" width="200" height="200" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Sources</text>
  <text x="660" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Base SQL</text>
  <text x="660" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Services REST</text>
  <text x="660" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Cache / Redis</text>
  <text x="660" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Events</text>
  <text x="660" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa">backends</text>

  <path d="M240 180 H295" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M500 180 H555" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="120" y="320" width="560" height="55" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="353" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">Client ' Query parsee ' arbre de resolvers ' reponse JSON</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

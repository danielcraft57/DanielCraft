<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">REST ressources et verbes</title>
  <desc id="desc">Ressource /orders et verbes HTTP CRUD</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">REST : ressources et verbes HTTP</text>

  <rect x="280" y="70" width="240" height="50" rx="8" fill="#2563eb"/>
  <text x="400" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">/orders</text>

  <rect x="40" y="160" width="160" height="90" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">GET</text>
  <text x="120" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Lire / lister</text>

  <rect x="230" y="160" width="160" height="90" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="310" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">POST</text>
  <text x="310" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Creer</text>

  <rect x="420" y="160" width="160" height="90" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">PUT/PATCH</text>
  <text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Mettre a jour</text>

  <rect x="610" y="160" width="150" height="90" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">DELETE</text>
  <text x="685" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Supprimer</text>

  <path d="M400 120 V155" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M120 120 H400" stroke="#0f172a" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M310 120 H400" stroke="#0f172a" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M500 120 H400" stroke="#0f172a" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M685 120 H400" stroke="#0f172a" stroke-width="1.5" fill="none" opacity="0.3"/>

  <rect x="100" y="290" width="600" height="80" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Statuts : 200 OK - 201 Created - 204 No Content - 404 - 409</text>
  <text x="400" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2563eb">Idempotence : GET, PUT, DELETE - POST non idempotent</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

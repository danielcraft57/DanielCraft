<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Couches EDR et XDR</title>
  <desc id="desc">Endpoint EDR et extension XDR multi-telemetrie</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">EDR vs XDR : couches de detection</text>

  <!-- EDR column -->
  <text x="220" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">EDR</text>
  <rect x="100" y="90" width="240" height="70" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Endpoint agent</text>
  <text x="220" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Processus, fichiers, memoire</text>

  <rect x="100" y="180" width="240" height="70" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="220" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Telemetrie endpoint</text>
  <text x="220" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">IOC / comportement</text>

  <rect x="100" y="270" width="240" height="70" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Containment local</text>
  <text x="220" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Isoler / tuer process</text>

  <!-- XDR column -->
  <text x="580" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">XDR</text>
  <rect x="460" y="90" width="280" height="250" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626">Corrélation multi-sources</text>

  <rect x="485" y="145" width="230" height="36" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Endpoint (EDR)</text>
  <rect x="485" y="195" width="230" height="36" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="600" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Reseau / email / IdP</text>
  <rect x="485" y="245" width="230" height="36" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="600" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Cloud / SaaS / workload</text>
  <text x="600" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Incident unique transversal</text>

  <path d="M340 215 H455" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">XDR etend l'EDR pour relier les signaux au-dela de l'endpoint</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

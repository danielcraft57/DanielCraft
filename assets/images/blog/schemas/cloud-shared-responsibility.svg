<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Responsabilite partagee</title>
  <desc id="desc">Provider vs client sur IaaS PaaS SaaS</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Responsabilite partagee</text>
  <rect x="40" y="70" width="340" height="280" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">Provider</text>
  <rect x="420" y="70" width="340" height="280" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626">Toi (client)</text>
  <rect x="70" y="130" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="210" y="151" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Hardware / datacenter</text>
  <rect x="70" y="170" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="210" y="191" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Hyperviseur</text>
  <rect x="70" y="210" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="210" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Service managé</text>
  <rect x="70" y="250" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="210" y="271" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Dispo region</text>
  <rect x="450" y="130" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="590" y="151" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Identites IAM</text>
  <rect x="450" y="170" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="590" y="191" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Config reseaux</text>
  <rect x="450" y="210" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="590" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Donnees / chiffrement</text>
  <rect x="450" y="250" width="280" height="32" rx="6" fill="#f5f7fb" stroke="#60a5fa"/>
  <text x="590" y="271" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Patch apps / images</text>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">CSPM trouve tes erreurs de config. CWPP protege ce qui tourne.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>

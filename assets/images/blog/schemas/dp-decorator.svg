<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Decorator</title>
  <desc id="desc">Couches d'options</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Decorator</text>
  <rect x="120" y="70" width="560" height="48" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Base</text>
  <text x="400" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Objet simple</text>
  <rect x="120" y="128" width="560" height="48" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Option A</text>
  <text x="400" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Ajoute un comportement</text>
  <rect x="120" y="186" width="560" height="48" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Option B</text>
  <text x="400" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Encore une couche</text>
  <rect x="120" y="244" width="560" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Resultat</text>
  <text x="400" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">Compose sans tout recoder</text>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Comme des options sur une voiture</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

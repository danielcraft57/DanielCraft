<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Design system tokens</title>
  <desc id="desc">Tokens primitifs, semantiques et composants</desc>
  <rect width="800" height="420" fill="#f5f7fb"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Design system : tokens</text>

  <rect x="50" y="90" width="200" height="200" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Primitifs</text>
  <text x="150" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">color.blue.600</text>
  <text x="150" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">space.4 = 16px</text>
  <text x="150" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">radius.md</text>
  <text x="150" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">font.size.sm</text>
  <circle cx="100" cy="265" r="12" fill="#2563eb"/>
  <circle cx="130" cy="265" r="12" fill="#60a5fa"/>
  <circle cx="160" cy="265" r="12" fill="#dc2626"/>

  <rect x="300" y="90" width="200" height="200" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Semantiques</text>
  <text x="400" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">color.action.primary</text>
  <text x="400" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">color.danger</text>
  <text x="400" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">spacing.section</text>
  <text x="400" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">text.body</text>
  <text x="400" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa">intention UI</text>

  <rect x="550" y="90" width="200" height="200" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Composants</text>
  <text x="650" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Button.primary.bg</text>
  <text x="650" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Input.border</text>
  <text x="650" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Card.padding</text>
  <text x="650" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Alert.error</text>
  <rect x="600" y="255" width="100" height="28" rx="6" fill="#2563eb"/>
  <text x="650" y="273" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#fff">Button</text>

  <path d="M250 190 H295" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M500 190 H545" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="400" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">Une source de verite - themes light/dark - multi-plateformes</text>
  <text x="400" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2563eb">Changer un token = propager partout</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

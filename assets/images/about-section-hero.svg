<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="about-hero-title about-hero-desc">
  <title id="about-hero-title">DanielCraft — illustration profil développeur</title>
  <desc id="about-hero-desc">Carte arrondie aux tons bleu métal, silhouette abstraite de développeur et motifs évoquant le code et l'analyse.</desc>
  <defs>
    <linearGradient id="about-card" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#7bcde3"/>
      <stop offset="45%" stop-color="#4da9d6"/>
      <stop offset="100%" stop-color="#2f78a6"/>
    </linearGradient>
    <linearGradient id="about-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="about-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="28" flood-color="#0f3550" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#f3f4f6"/>
  <rect x="72" y="72" width="656" height="656" rx="52" ry="52" fill="url(#about-card)" filter="url(#about-shadow)"/>
  <rect x="72" y="72" width="656" height="320" rx="52" ry="52" fill="url(#about-shine)"/>
  <!-- Motifs discrets (data / connexions) -->
  <g fill="none" stroke="#e8f4fb" stroke-width="5" stroke-linecap="round" opacity="0.35">
    <path d="M 140 620 C 220 540 260 700 360 640"/>
    <path d="M 620 600 C 540 520 500 680 420 630"/>
    <circle cx="160" cy="240" r="8" fill="#e8f4fb" stroke="none" opacity="0.5"/>
    <circle cx="640" cy="280" r="6" fill="#e8f4fb" stroke="none" opacity="0.45"/>
    <circle cx="680" cy="520" r="7" fill="#e8f4fb" stroke="none" opacity="0.4"/>
  </g>
  <!-- Accolades stylisées -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.42">
    <path d="M 210 520 L 175 400 L 210 280"/>
    <path d="M 590 520 L 625 400 L 590 280"/>
  </g>
  <!-- Silhouette abstraite développeur -->
  <g transform="translate(400, 318)">
    <circle cx="0" cy="0" r="78" fill="#f0f9ff" opacity="0.95"/>
    <ellipse cx="0" cy="18" rx="82" ry="72" fill="#f0f9ff" opacity="0.35"/>
    <path d="M -118 108 C -118 48 -66 36 0 36 C 66 36 118 48 118 108 L 118 268 C 118 312 92 338 52 338 L -52 338 C -92 338 -118 312 -118 268 Z" fill="#dbeafe" opacity="0.92"/>
  </g>
  <!-- Fenêtre / écran simplifié -->
  <rect x="248" y="468" width="304" height="188" rx="16" fill="#0f3550" opacity="0.22"/>
  <rect x="268" y="492" width="88" height="12" rx="6" fill="#f0f9ff" opacity="0.55"/>
  <rect x="268" y="520" width="200" height="10" rx="5" fill="#f0f9ff" opacity="0.35"/>
  <rect x="268" y="544" width="160" height="10" rx="5" fill="#f0f9ff" opacity="0.28"/>
  <rect x="268" y="596" width="120" height="10" rx="5" fill="#7bcde3" opacity="0.55"/>
</svg>

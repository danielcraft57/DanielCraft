<!DOCTYPE html>
<html lang="fr" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Blog DanielCraft</title>
    <meta name="description" content="{{EXCERPT}}">
    <meta name="keywords" content="{{META_KEYWORDS}}">
    <meta name="author" content="Loïc DANIEL">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="{{PAGE_URL}}">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4VN3CKFP14"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4VN3CKFP14');
    </script>

    <meta property="og:type" content="article">
    <meta property="og:url" content="{{PAGE_URL}}">
    <meta property="og:title" content="{{TITLE}} | Blog DanielCraft">
    <meta property="og:description" content="{{EXCERPT}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:image:secure_url" content="{{OG_IMAGE}}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{TITLE}}">
    <meta property="og:site_name" content="DanielCraft">
    <meta property="og:locale" content="fr_FR">
    <meta property="article:published_time" content="{{DATE_ISO}}">
    <meta property="article:author" content="Loïc DANIEL">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}} | Blog DanielCraft">
    <meta name="twitter:description" content="{{EXCERPT}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    <meta name="theme-color" content="#2f78a6">
    <link rel="icon" href="{{ROOT}}favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{{ROOT}}assets/icons/favicon.svg">
    <link rel="stylesheet" href="{{ASSETS}}/css/main.css">
    <link rel="stylesheet" href="{{ASSETS}}/css/responsive.css">
    <link rel="stylesheet" href="{{ASSETS}}/css/blog.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
{{SCHEMA_JSON_LD}}
</head>
<body>
    <a href="#main-content" class="skip-link">Aller au contenu</a>
{{NAV_HTML}}

    <main id="main-content" class="blog-article-section">
        <article class="blog-article" itemscope itemtype="https://schema.org/Article">
            <header class="blog-article-header">
                <nav aria-label="Fil d'Ariane">
                    <a href="/blog/" class="back-link"><i class="fas fa-arrow-left"></i> Retour au blog</a>
                </nav>
                <h1 itemprop="headline">{{TITLE}}</h1>
                <figure class="blog-article-hero" aria-hidden="true">
                    <img src="{{HERO_IMAGE}}" alt="{{TITLE}}" class="blog-article-hero-image" loading="eager">
                </figure>
            </header>
            <div class="blog-article-layout">
                <aside class="blog-article-sidebar" aria-label="Infos article">
                    <div class="sidebar-block sidebar-meta">
                        <time datetime="{{DATE_ISO}}" itemprop="datePublished">{{DATE_FR}}</time>
                    </div>
                    <div class="sidebar-block sidebar-share">
                        <span class="sidebar-label">Partager</span>
                        <div class="share-links">
                            <a href="{{SHARE_TWITTER_URL}}" target="_blank" rel="noopener noreferrer" class="share-link" aria-label="Partager sur Twitter"><i class="fab fa-twitter"></i></a>
                            <a href="{{SHARE_LINKEDIN_URL}}" target="_blank" rel="noopener noreferrer" class="share-link" aria-label="Partager sur LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                            <button type="button" class="share-link share-copy" data-url="{{PAGE_URL}}" aria-label="Copier le lien"><i class="fas fa-link"></i><span>Copier</span></button>
                        </div>
                    </div>
                    <div class="sidebar-block sidebar-series">
                        {{SERIES_HTML}}
                    </div>
                </aside>
                <div class="blog-article-main">
                    <div class="article-content prose" itemprop="articleBody">
                        {{CONTENT}}
                    </div>
                    <nav class="article-prev-next" aria-label="Article precedent et suivant">
                        {{PREV_NEXT}}
                    </nav>
                    <section class="article-recommendations" aria-label="Articles recommandes">
                        {{RECOMMENDATIONS}}
                    </section>
                </div>
            </div>
        </article>
    </main>
    <script src="{{ASSETS}}/js/main.js" defer></script>
    <script>
      (function() {
        document.querySelectorAll('.share-copy').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var url = this.getAttribute('data-url');
            if (url && navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(url).then(function() {
                var span = btn.querySelector('span');
                if (span) { span.textContent = 'Copié !'; setTimeout(function() { span.textContent = 'Copier'; }, 2000); }
              });
            }
          });
        });
      })();
    </script>

{{MODALS_HTML}}
{{FOOTER_HTML}}
</body>
</html>

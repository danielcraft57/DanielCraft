<!DOCTYPE html>
<html lang="fr" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Blog DanielCraft</title>
    <meta name="description" content="{{EXCERPT}}">
    <meta name="keywords" content="{{META_KEYWORDS}}">
    <meta name="author" content="Loïc DANIEL">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="{{PAGE_URL}}">

    {{ANALYTICS_HTML}}

    <meta property="og:type" content="article">
    <meta property="og:url" content="{{PAGE_URL}}">
    <meta property="og:title" content="{{TITLE}} | Blog DanielCraft">
    <meta property="og:description" content="{{EXCERPT}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:image:secure_url" content="{{OG_IMAGE}}">
    <meta property="og:image:type" content="{{OG_IMAGE_TYPE}}">
    <meta property="og:image:width" content="{{OG_IMAGE_WIDTH}}">
    <meta property="og:image:height" content="{{OG_IMAGE_HEIGHT}}">
    <meta property="og:image:alt" content="Visuel de partage DanielCraft — {{TITLE}}">
    <meta property="og:site_name" content="DanielCraft">
    <meta property="og:locale" content="fr_FR">
    <meta property="article:published_time" content="{{DATE_ISO}}">
    <meta property="article:author" content="Loïc DANIEL">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}} | Blog DanielCraft">
    <meta name="twitter:description" content="{{EXCERPT}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    <meta name="theme-color" content="#2f78a6">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="stylesheet" href="{{ASSETS}}/css/main.css{{ASSETS_QUERY}}">
    <link rel="stylesheet" href="{{ASSETS}}/css/animations.css{{ASSETS_QUERY}}">
    <link rel="stylesheet" href="{{ASSETS}}/css/responsive.css{{ASSETS_QUERY}}">
    <link rel="stylesheet" href="{{ASSETS}}/css/blog.css{{ASSETS_QUERY}}">
    <link rel="search" type="application/opensearchdescription+xml" title="DanielCraft Blog" href="/assets/opensearch-blog.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": {{JSON_HEADLINE}},
      "description": {{JSON_DESCRIPTION}},
      "image": {{JSON_IMAGE}},
      "datePublished": {{JSON_DATE_PUBLISHED}},
      "dateModified": {{JSON_DATE_MODIFIED}},
      "inLanguage": "fr-FR",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": {{JSON_PAGE_URL}}
      },
      "author": {
        "@type": "Person",
        "name": "Loïc DANIEL",
        "url": {{JSON_SITE_BASE}}
      },
      "publisher": {
        "@type": "Organization",
        "name": "DanielCraft",
        "url": {{JSON_SITE_BASE}},
        "logo": {
          "@type": "ImageObject",
          "url": {{JSON_LOGO}}
        }
      }
    }
    </script>
</head>
<body>
    <a href="#main-content" class="skip-link">Aller au contenu</a>
{{NAV_HTML}}

    <main id="main-content" class="blog-article-section">
        <article class="blog-article" itemscope itemtype="https://schema.org/BlogPosting" itemid="{{PAGE_URL}}">
            <link itemprop="mainEntityOfPage" href="{{PAGE_URL}}">
            <meta itemprop="inLanguage" content="fr-FR">
            <header class="blog-article-header">
                {{BREADCRUMBS}}
                <p class="article-type article-type--header" itemprop="articleSection">{{ARTICLE_SECTION}}</p>
                <h1 itemprop="headline">{{TITLE}}</h1>
                <p class="blog-article-lead" itemprop="description">{{EXCERPT}}</p>
                <figure class="blog-article-hero">
                    <img src="{{HERO_IMAGE}}" alt="{{TITLE}}" class="blog-article-hero-image" loading="eager" itemprop="image">
                </figure>
            </header>
            <div class="blog-article-layout">
                <aside class="blog-article-sidebar" aria-label="Infos article">
                    <div class="sidebar-block sidebar-meta">
                        <time datetime="{{DATE_ISO}}" itemprop="datePublished">{{DATE_FR}}</time>
                        <meta itemprop="dateModified" content="{{DATE_MODIFIED_ISO}}">
                    </div>
                    <div class="sidebar-block sidebar-author" itemprop="author" itemscope itemtype="https://schema.org/Person">
                        <span class="sidebar-label">Auteur</span>
                        <a href="{{SITE_BASE}}/" itemprop="url"><span itemprop="name">Loïc DANIEL</span></a>
                    </div>
                    <div class="sidebar-block sidebar-publisher" itemprop="publisher" itemscope itemtype="https://schema.org/Organization">
                        <span class="sidebar-label">Éditeur</span>
                        <a href="{{SITE_BASE}}/" itemprop="url"><span itemprop="name">DanielCraft</span></a>
                        <link itemprop="logo" href="{{SITE_BASE}}/assets/images/og/home-1200x630.jpg">
                    </div>
                    <div class="sidebar-block sidebar-share">
                        <span class="sidebar-label">Partager</span>
                        <div class="share-links">
                            <a href="{{SHARE_TWITTER_URL}}" target="_blank" rel="noopener noreferrer" class="share-link" aria-label="Partager sur Twitter"><i class="fab fa-twitter"></i></a>
                            <a href="{{SHARE_LINKEDIN_URL}}" target="_blank" rel="noopener noreferrer" class="share-link" aria-label="Partager sur LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                            <button type="button" class="share-link share-copy" data-url="{{PAGE_URL}}" aria-label="Copier le lien"><i class="fas fa-link"></i><span>Copier</span></button>
                        </div>
                    </div>
                    <div class="sidebar-block sidebar-series">
                        {{SERIES_HTML}}
                    </div>
                </aside>
                <div class="blog-article-main">
                    <div class="article-content prose" itemprop="articleBody">
                        {{CONTENT}}
                    </div>
                    <nav class="article-prev-next" aria-label="Article precedent et suivant">
                        {{PREV_NEXT}}
                    </nav>
                    <section class="article-recommendations" aria-label="Articles recommandes">
                        {{RECOMMENDATIONS}}
                    </section>
                </div>
            </div>
        </article>
    </main>
    <script src="{{ASSETS}}/js/main.js{{ASSETS_QUERY}}" defer></script>
    <script>
      (function() {
        document.querySelectorAll('.share-copy').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var url = this.getAttribute('data-url');
            if (url && navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(url).then(function() {
                var span = btn.querySelector('span');
                if (span) { span.textContent = 'Copié !'; setTimeout(function() { span.textContent = 'Copier'; }, 2000); }
              });
            }
          });
        });
      })();
    </script>

{{MODALS_HTML}}
{{FOOTER_HTML}}
</body>
</html>

<!DOCTYPE html>
<html lang="fr" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Blog DanielCraft</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{META_KEYWORDS}}">
    <meta name="author" content="Loïc DANIEL">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{PAGE_URL}}">

    {{ANALYTICS_HTML}}

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{PAGE_URL}}">
    <meta property="og:title" content="{{TITLE}} | Blog DanielCraft">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:site_name" content="DanielCraft">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}} | Blog DanielCraft">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="theme-color" content="#2f78a6">
    <link rel="icon" href="{{ROOT}}/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{{ROOT}}/assets/icons/favicon.svg">
    <link rel="stylesheet" href="{{ASSETS}}/css/main.css">
    <link rel="stylesheet" href="{{ASSETS}}/css/responsive.css">
    <link rel="stylesheet" href="{{ASSETS}}/css/blog.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <a href="#main-content" class="skip-link">Aller au contenu</a>
{{NAV_HTML}}

    <main id="main-content" class="blog-page-section" itemscope itemtype="https://schema.org/CollectionPage">
        <meta itemprop="url" content="{{PAGE_URL}}">
        <div class="container blog-page">
            <nav aria-label="Fil d'Ariane">
                <a href="/blog/" class="back-link"><i class="fas fa-arrow-left"></i> Retour au blog</a>
            </nav>
            <header class="blog-header">
                <h1 itemprop="name">{{TITLE}}</h1>
                <p class="section-description" itemprop="description">{{DESCRIPTION}}</p>
            </header>
            <div class="articles-grid">
                {{ARTICLES_GRID}}
            </div>
        </div>
    </main>
    <script src="{{ASSETS}}/js/main.js" defer></script>

{{MODALS_HTML}}
{{FOOTER_HTML}}
</body>
</html>

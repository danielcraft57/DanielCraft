<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f5f3"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1c1c1f" font-weight="700">Bonnes pratiques : check utile</text>
<rect x="60" y="120" width="220" height="220" rx="14" fill="#2f3136" stroke="#2f3136" stroke-width="3"/>
<text x="170" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Preparer</text>
<text x="170" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f0a202" font-weight="400">les rituels</text>
<rect x="290" y="120" width="220" height="220" rx="14" fill="#ffffff" stroke="#2f3136" stroke-width="3"/>
<text x="400" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1c1c1f" font-weight="700">Tenir</text>
<text x="400" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5e5e66" font-weight="400">le temps</text>
<rect x="520" y="120" width="220" height="220" rx="14" fill="#f3eee6" stroke="#f0a202" stroke-width="3"/>
<text x="630" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7a5200" font-weight="700">Suivre</text>
<text x="630" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7a5200" font-weight="400">les actions</text>
<rect x="750" y="120" width="190" height="220" rx="14" fill="#f0a202" stroke="#f0a202" stroke-width="3"/>
<text x="845" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1c1c1f" font-weight="700">Dire non</text>
<text x="845" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1c1c1f" font-weight="400">au theatre</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5e5e66" font-weight="400">Trois pratiques du mois battent trente posters.</text>
</svg>

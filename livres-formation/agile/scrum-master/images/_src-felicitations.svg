<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f5f3"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1c1c1f" font-weight="700">Bravo - tu peux servir l'equipe</text>
<rect x="150" y="120" width="700" height="240" rx="14" fill="#f3eee6" stroke="#f0a202" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a5200" font-weight="700">Faciliter. Lever. Proteger. Coacher.</text>
<text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7a5200" font-weight="400">Tu as des gestes utiles des la semaine prochaine.</text>
<text x="500" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5e5e66" font-weight="400">Prochaine etape : ton plan 30 jours.</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5e5e66" font-weight="400">Chez DanielCraft : on forme des gens qui aident vraiment.</text>
</svg>

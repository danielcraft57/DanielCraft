<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f5f3"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1c1c1f" font-weight="700">Obstacle = nommer + proprietaire + action</text>
<rect x="60" y="130" width="220" height="220" rx="14" fill="#ffffff" stroke="#2f3136" stroke-width="3"/>
<text x="170" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1c1c1f" font-weight="700">Nommer</text>
<text x="170" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5e5e66" font-weight="400">le frein</text>
<line x1="280" y1="240" x2="330" y2="240" stroke="#f0a202" stroke-width="4"/>
<rect x="330" y="130" width="220" height="220" rx="14" fill="#f3eee6" stroke="#f0a202" stroke-width="3"/>
<text x="440" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a5200" font-weight="700">Qui ?</text>
<text x="440" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a5200" font-weight="400">peut agir</text>
<line x1="550" y1="240" x2="600" y2="240" stroke="#f0a202" stroke-width="4"/>
<rect x="600" y="130" width="220" height="220" rx="14" fill="#2f3136" stroke="#2f3136" stroke-width="3"/>
<text x="710" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fff" font-weight="700">Action</text>
<text x="710" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#f0a202" font-weight="400">aujourd'hui</text>
<rect x="840" y="180" width="100" height="120" rx="14" fill="#f0a202" stroke="#f0a202" stroke-width="3"/>
<text x="890" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1c1c1f" font-weight="700">Go</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5e5e66" font-weight="400">Sans ces trois cases, ca reste du vent.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Bravo - tu tiens le cadre Scrum</text>
<rect x="150" y="120" width="700" height="240" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#3f6212" font-weight="700">Sprint. Roles. Artefacts. Evenements.</text>
<text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="400">Tu peux animer un premier tour demain.</text>
<text x="500" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5c6480" font-weight="400">Prochaine etape : un sprint de 5 jours.</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Chez DanielCraft : on forme des gens qui livrent.</text>
</svg>

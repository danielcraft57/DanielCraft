<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Exemple : board simple de Lea</text>
<rect x="60" y="120" width="200" height="260" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="160" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">A faire</text>
<text x="160" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c6480" font-weight="400">3 cartes</text>
<rect x="280" y="120" width="200" height="260" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="380" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3f6212" font-weight="700">En cours</text>
<text x="380" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3f6212" font-weight="400">1 carte</text>
<rect x="500" y="120" width="200" height="260" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="600" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Revue</text>
<text x="600" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a3e635" font-weight="400">1 carte</text>
<rect x="720" y="120" width="220" height="260" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="830" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">Done</text>
<text x="830" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1f3a" font-weight="400">page contact</text>
<text x="500" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Sam : "une carte en cours a la fois. On avance."</text>

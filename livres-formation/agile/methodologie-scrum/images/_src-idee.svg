<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Scrum = cadre court + inspection</text>
<rect x="80" y="120" width="240" height="220" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="200" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fff" font-weight="700">Sprint</text>
<text x="200" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a3e635" font-weight="400">temps borne</text>
<line x1="320" y1="230" x2="380" y2="230" stroke="#a3e635" stroke-width="4"/>
<rect x="380" y="120" width="240" height="220" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#3f6212" font-weight="700">Inspecter</text>
<text x="500" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3f6212" font-weight="400">ce qu'on a fait</text>
<line x1="620" y1="230" x2="680" y2="230" stroke="#a3e635" stroke-width="4"/>
<rect x="680" y="120" width="240" height="220" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="800" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a1f3a" font-weight="700">Adapter</text>
<text x="800" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a1f3a" font-weight="400">puis recommencer</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Un rythme. Pas un badge de certification.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Ready et Done : deux checklists</text>
<rect x="80" y="130" width="400" height="240" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="280" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#3f6212" font-weight="700">Ready</text>
<text x="280" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3f6212" font-weight="400">assez clair pour</text>
<text x="280" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3f6212" font-weight="400">commencer</text>
<rect x="520" y="130" width="400" height="240" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="720" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700">Done</text>
<text x="720" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a3e635" font-weight="400">assez fini pour</text>
<text x="720" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a3e635" font-weight="400">montrer</text>
<text x="500" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Fini = Done coche. Pas "presque".</text>
</svg>

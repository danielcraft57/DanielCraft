<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">2026 : cadre intact, outils plus sobres</text>
<rect x="60" y="130" width="220" height="220" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="170" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fff" font-weight="700">Sprints</text>
<text x="170" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a3e635" font-weight="400">toujours courts</text>
<rect x="290" y="130" width="220" height="220" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="400" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1a1f3a" font-weight="700">Remote</text>
<text x="400" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c6480" font-weight="400">mieux cadre</text>
<rect x="520" y="130" width="220" height="220" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="630" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#3f6212" font-weight="700">IA utile</text>
<text x="630" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3f6212" font-weight="400">+ controle</text>
<rect x="750" y="130" width="190" height="220" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="845" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">Preuves</text>
<text x="845" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a1f3a" font-weight="400">visibles</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">L'outil change. Le rythme et l'inspection restent.</text>
</svg>

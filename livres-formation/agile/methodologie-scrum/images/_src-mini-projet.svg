<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Mini-projet : simuler un sprint</text>
<rect x="50" y="140" width="150" height="180" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="125" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1a1f3a" font-weight="700">J1</text>
<text x="125" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6480" font-weight="400">goal</text>
<rect x="220" y="140" width="150" height="180" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="295" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="700">J2-3</text>
<text x="295" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3f6212" font-weight="400">faire</text>
<rect x="390" y="140" width="150" height="180" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="465" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">J4</text>
<text x="465" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a3e635" font-weight="400">daily</text>
<rect x="560" y="140" width="150" height="180" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="635" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1a1f3a" font-weight="700">J5</text>
<text x="635" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6480" font-weight="400">review</text>
<rect x="730" y="140" width="200" height="180" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="830" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">J5 soir</text>
<text x="830" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1f3a" font-weight="400">retro</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Un vrai tour court. Une preuve. Une lecon.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Une equipe Scrum, pas trois silos</text>
<rect x="100" y="130" width="800" height="90" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="500" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fff" font-weight="700">Meme but de sprint</text>
<rect x="100" y="250" width="240" height="140" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="220" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="700">Petits groupes</text>
<text x="220" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3f6212" font-weight="400">qui se parlent</text>
<rect x="380" y="250" width="240" height="140" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="500" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">Competences</text>
<text x="500" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c6480" font-weight="400">melangees</text>
<rect x="660" y="250" width="240" height="140" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="780" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1a1f3a" font-weight="700">Responsabilite</text>
<text x="780" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1f3a" font-weight="400">partagee</text>
<text x="500" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Si personne ne se parle, ce n'est pas une equipe.</text>
</svg>

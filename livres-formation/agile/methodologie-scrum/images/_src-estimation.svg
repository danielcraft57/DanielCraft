<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Estimation relative : comparer, pas predire</text>
<rect x="70" y="140" width="200" height="200" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="170" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1a1f3a" font-weight="700">S</text>
<text x="170" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c6480" font-weight="400">petit</text>
<rect x="290" y="140" width="200" height="200" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="390" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#3f6212" font-weight="700">M</text>
<text x="390" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3f6212" font-weight="400">moyen</text>
<rect x="510" y="140" width="200" height="200" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="610" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#fff" font-weight="700">L</text>
<text x="610" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a3e635" font-weight="400">gros</text>
<rect x="730" y="140" width="200" height="200" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="830" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1a1f3a" font-weight="700">?</text>
<text x="830" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1f3a" font-weight="400">decouper</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">On compare. On ne vend pas des dates magiques.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Atelier sprint : designer un tour</text>
<rect x="80" y="120" width="500" height="280" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="330" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1a1f3a" font-weight="700">Cadre du sprint</text>
<text x="330" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c6480" font-weight="400">duree + goal + Done</text>
<text x="330" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c6480" font-weight="400">3 a 5 items max</text>
<text x="330" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c6480" font-weight="400">date de review</text>
<rect x="620" y="120" width="300" height="120" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="770" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="700">Lot choisi</text>
<text x="770" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3f6212" font-weight="400">montrable</text>
<rect x="620" y="260" width="300" height="140" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="770" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">Parking</text>
<text x="770" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a1f3a" font-weight="400">le surplus</text>
<text x="500" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Une heure. Sortie : sprint pret a demarrer.</text>
</svg>

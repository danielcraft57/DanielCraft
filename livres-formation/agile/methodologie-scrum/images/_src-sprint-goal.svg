<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Sprint Goal : une boussole pour le tour</text>
<rect x="150" y="130" width="700" height="200" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#3f6212" font-weight="700">Un but clair pour ce sprint</text>
<text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="400">pas une liste de 40 tickets</text>
<rect x="200" y="360" width="200" height="60" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="300" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Focus</text>
<rect x="420" y="360" width="200" height="60" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="520" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a1f3a" font-weight="700">Negociation</text>
<rect x="640" y="360" width="200" height="60" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="3"/>
<text x="740" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">Sens</text>
<text x="500" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5c6480" font-weight="400">Si le but disparait, le sprint perd son fil.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f4f5fb"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a1f3a" font-weight="700">Trois roles, trois jobs clairs</text>
<rect x="350" y="100" width="300" height="110" rx="14" fill="#2d3a7c" stroke="#2d3a7c" stroke-width="3"/>
<text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Product Owner</text>
<text x="500" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a3e635" font-weight="400">quoi / pourquoi</text>
<line x1="400" y1="210" x2="220" y2="260" stroke="#a3e635" stroke-width="3"/>
<line x1="600" y1="210" x2="780" y2="260" stroke="#a3e635" stroke-width="3"/>
<rect x="70" y="270" width="280" height="140" rx="14" fill="#eef2ff" stroke="#a3e635" stroke-width="3"/>
<text x="210" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="700">Scrum Master</text>
<text x="210" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3f6212" font-weight="400">aide le cadre</text>
<rect x="650" y="270" width="280" height="140" rx="14" fill="#ffffff" stroke="#2d3a7c" stroke-width="3"/>
<text x="790" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1f3a" font-weight="700">Developers</text>
<text x="790" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c6480" font-weight="400">livrent l'increment</text>
<text x="500" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6480" font-weight="400">Pas de theatre de titres. Des comptes clairs.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">Roadmap legere : maintenant / ensuite / plus tard</text>
<rect x="80" y="140" width="260" height="200" rx="14" fill="#f2a65a" stroke="#f2a65a" stroke-width="3"/>
<text x="210" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#241528" font-weight="700">Maintenant</text>
<text x="210" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#241528" font-weight="400">ce sprint</text>
<rect x="370" y="140" width="260" height="200" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>
<text x="500" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#8a4b1a" font-weight="700">Ensuite</text>
<text x="500" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8a4b1a" font-weight="400">prochains tours</text>
<rect x="660" y="140" width="260" height="200" rx="14" fill="#ffffff" stroke="#5c2a4a" stroke-width="3"/>
<text x="790" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#241528" font-weight="700">Plus tard</text>
<text x="790" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b5a70" font-weight="400">parking</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b5a70" font-weight="400">Une page. Pas un Gantt de 40 lignes.</text>
</svg>

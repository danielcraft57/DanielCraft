<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">Bravo - tu peux porter la valeur</text>
<rect x="150" y="120" width="700" height="240" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#8a4b1a" font-weight="700">Vision. Priorites. Stories. Dire non.</text>
<text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8a4b1a" font-weight="400">Tu as de quoi piloter un backlog utile demain.</text>
<text x="500" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b5a70" font-weight="400">Prochaine etape : ta vitrine en 8 items.</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b5a70" font-weight="400">Chez DanielCraft : on forme des gens qui decident.</text>
</svg>

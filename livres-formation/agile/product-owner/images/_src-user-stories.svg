<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">User stories + criteres d'acceptation</text>
<rect x="80" y="120" width="500" height="280" rx="14" fill="#ffffff" stroke="#5c2a4a" stroke-width="3"/>
<text x="330" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#241528" font-weight="700">En tant que...</text>
<text x="330" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#241528" font-weight="700">je veux...</text>
<text x="330" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#241528" font-weight="700">afin de...</text>
<text x="330" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b5a70" font-weight="400">petit, testable</text>
<rect x="620" y="120" width="300" height="280" rx="14" fill="#f2a65a" stroke="#f2a65a" stroke-width="3"/>
<text x="770" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#241528" font-weight="700">Criteres</text>
<text x="770" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#241528" font-weight="400">Done visible</text>
<text x="770" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#241528" font-weight="400">exemples concrets</text>
<text x="500" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b5a70" font-weight="400">Sans criteres, la story reste du souhait.</text>
</svg>

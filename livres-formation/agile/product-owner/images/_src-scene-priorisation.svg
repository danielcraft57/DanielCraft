<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">Exemple : Max et Lea trient cinq cartes</text>
<rect x="60" y="120" width="160" height="220" rx="14" fill="#f2a65a" stroke="#f2a65a" stroke-width="3"/>
<text x="140" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#241528" font-weight="700">1</text>
<text x="140" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#241528" font-weight="400">Devis</text>
<rect x="240" y="120" width="160" height="220" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>
<text x="320" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#8a4b1a" font-weight="700">2</text>
<text x="320" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8a4b1a" font-weight="400">Horaires</text>
<rect x="420" y="120" width="160" height="220" rx="14" fill="#ffffff" stroke="#5c2a4a" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#241528" font-weight="700">3</text>
<text x="500" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b5a70" font-weight="400">Photos</text>
<rect x="600" y="120" width="160" height="220" rx="14" fill="#ffffff" stroke="#5c2a4a" stroke-width="3"/>
<text x="680" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#241528" font-weight="700">4</text>
<text x="680" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b5a70" font-weight="400">Avis</text>
<rect x="780" y="120" width="160" height="220" rx="14" fill="#ffffff" stroke="#6b5a70" stroke-width="3"/>
<text x="860" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#fff" font-weight="700">5</text>
<text x="860" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#fff" font-weight="400">Blog</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b5a70" font-weight="400">Lea : "si on n'en fait qu'une cette semaine ?"</text>
<text x="500" y="445" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b5a70" font-weight="400">Le devis monte. Le blog descend sans drame.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">Vision produit : une boussole courte</text>
<rect x="150" y="130" width="700" height="200" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#8a4b1a" font-weight="700">Pour qui + quel probleme + quelle promesse</text>
<text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8a4b1a" font-weight="400">en une page, pas un roman</text>
<rect x="200" y="360" width="200" height="60" rx="14" fill="#5c2a4a" stroke="#5c2a4a" stroke-width="3"/>
<text x="300" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Public</text>
<rect x="420" y="360" width="200" height="60" rx="14" fill="#ffffff" stroke="#5c2a4a" stroke-width="3"/>
<text x="520" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#241528" font-weight="700">Probleme</text>
<rect x="640" y="360" width="200" height="60" rx="14" fill="#f2a65a" stroke="#f2a65a" stroke-width="3"/>
<text x="740" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#241528" font-weight="700">Promesse</text>
<text x="500" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b5a70" font-weight="400">Si ca ne tient pas en une phrase, c'est trop flou.</text>
</svg>

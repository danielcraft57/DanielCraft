<text x="210" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f2a65a" font-weight="400">qui s'en sert ?</text>
<rect x="370" y="130" width="280" height="230" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>

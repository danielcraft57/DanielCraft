<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">Discovery et Delivery : deux moteurs</text>
<rect x="100" y="140" width="360" height="220" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>
<text x="280" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#8a4b1a" font-weight="700">Discovery</text>
<text x="280" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#8a4b1a" font-weight="400">apprendre vite</text>
<text x="280" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8a4b1a" font-weight="400">avant de construire gros</text>
<rect x="540" y="140" width="360" height="220" rx="14" fill="#5c2a4a" stroke="#5c2a4a" stroke-width="3"/>
<text x="720" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fff" font-weight="700">Delivery</text>
<text x="720" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#f2a65a" font-weight="400">livrer Done</text>
<text x="720" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f2a65a" font-weight="400">en petits lots</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b5a70" font-weight="400">Chercher et livrer. Pas l'un sans l'autre.</text>
</svg>

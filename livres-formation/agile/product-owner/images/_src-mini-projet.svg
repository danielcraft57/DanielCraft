<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">Mini-projet : backlog d'une vitrine locale</text>
<rect x="50" y="140" width="170" height="180" rx="14" fill="#ffffff" stroke="#5c2a4a" stroke-width="3"/>
<text x="135" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#241528" font-weight="700">Vision</text>
<text x="135" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b5a70" font-weight="400">1 page</text>
<rect x="240" y="140" width="170" height="180" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>
<text x="325" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8a4b1a" font-weight="700">8 items</text>
<text x="325" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8a4b1a" font-weight="400">ordonnes</text>
<rect x="430" y="140" width="170" height="180" rx="14" fill="#5c2a4a" stroke="#5c2a4a" stroke-width="3"/>
<text x="515" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Lot 1</text>
<text x="515" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f2a65a" font-weight="400">2 cartes</text>
<rect x="620" y="140" width="170" height="180" rx="14" fill="#ffffff" stroke="#5c2a4a" stroke-width="3"/>
<text x="705" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#241528" font-weight="700">Criteres</text>
<text x="705" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b5a70" font-weight="400">Done</text>
<rect x="810" y="160" width="140" height="140" rx="14" fill="#f2a65a" stroke="#f2a65a" stroke-width="3"/>
<text x="880" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#241528" font-weight="700">Review</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b5a70" font-weight="400">Une vitrine. Un backlog. Une premiere livraison.</text>
</svg>

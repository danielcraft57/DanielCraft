<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f8f3f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#241528" font-weight="700">Exemple : Lea ecrit la vision d'une vitrine</text>
<rect x="70" y="110" width="280" height="300" rx="14" fill="#5c2a4a" stroke="#5c2a4a" stroke-width="3"/>
<text x="210" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Public</text>
<text x="210" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#f2a65a" font-weight="400">clients locaux</text>
<text x="210" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#f2a65a" font-weight="400">sur telephone</text>
<rect x="370" y="110" width="260" height="300" rx="14" fill="#f6ebe3" stroke="#f2a65a" stroke-width="3"/>
<text x="500" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8a4b1a" font-weight="700">Probleme</text>
<text x="500" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8a4b1a" font-weight="400">trouver horaires</text>
<text x="500" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8a4b1a" font-weight="400">+ demander devis</text>
<rect x="650" y="110" width="280" height="300" rx="14" fill="#f2a65a" stroke="#f2a65a" stroke-width="3"/>
<text x="790" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#241528" font-weight="700">Promesse</text>
<text x="790" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#241528" font-weight="400">clair en 30 sec</text>
<text x="790" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#241528" font-weight="400">devis en 2 clics</text>
<text x="500" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b5a70" font-weight="400">Sam : "si tu ne gardes qu'une phrase ?" Lea la lit a voix haute.</text>
</svg>

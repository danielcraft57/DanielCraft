<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f3f8f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#122a2a" font-weight="700">Bravo - tu tiens le rythme</text>
<rect x="150" y="120" width="700" height="240" rx="14" fill="#e8f2ef" stroke="#d4a017" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a5a0a" font-weight="700">Petits lots. Feedback. Fini defini.</text>
<text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a5a0a" font-weight="400">Tu peux piloter un projet court demain.</text>
<text x="500" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5a6e6e" font-weight="400">Prochaine etape : une iteration de 7 jours.</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a6e6e" font-weight="400">Chez DanielCraft : on forme des gens qui livrent.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f3f8f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#122a2a" font-weight="700">Cycle d'iteration (sprint court)</text>
<rect x="60" y="140" width="180" height="180" rx="14" fill="#0f4c4c" stroke="#0f4c4c" stroke-width="3"/>
<text x="150" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Choisir</text>
<text x="150" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d4a017" font-weight="400">le lot</text>
<line x1="240" y1="230" x2="290" y2="230" stroke="#d4a017" stroke-width="4"/>
<rect x="290" y="140" width="180" height="180" rx="14" fill="#ffffff" stroke="#0f4c4c" stroke-width="3"/>
<text x="380" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#122a2a" font-weight="700">Faire</text>
<text x="380" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5a6e6e" font-weight="400">borne dans le temps</text>
<line x1="470" y1="230" x2="520" y2="230" stroke="#d4a017" stroke-width="4"/>
<rect x="520" y="140" width="180" height="180" rx="14" fill="#e8f2ef" stroke="#d4a017" stroke-width="3"/>
<text x="610" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7a5a0a" font-weight="700">Montrer</text>
<text x="610" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a5a0a" font-weight="400">revue</text>
<line x1="700" y1="230" x2="750" y2="230" stroke="#d4a017" stroke-width="4"/>
<rect x="750" y="140" width="190" height="180" rx="14" fill="#d4a017" stroke="#d4a017" stroke-width="3"/>
<text x="845" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#122a2a" font-weight="700">Apprendre</text>
<text x="845" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#122a2a" font-weight="400">puis tour suivant</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a6e6e" font-weight="400">Une date de fin. Un resultat montrable.</text>
</svg>

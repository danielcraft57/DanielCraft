<text x="330" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a6e6e" font-weight="400">2. ...</text>
<text x="330" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a6e6e" font-weight="400">3. ...</text>
<text x="330" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a6e6e" font-weight="400">4. ...  5. ...</text>
<rect x="620" y="110" width="300" height="120" rx="14" fill="#e8f2ef" stroke="#d4a017" stroke-width="3"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f3f8f7"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#122a2a" font-weight="700">Quatre ceremonies utiles</text>
<rect x="50" y="120" width="220" height="220" rx="14" fill="#0f4c4c" stroke="#0f4c4c" stroke-width="3"/>
<text x="160" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Planifier</text>
<text x="160" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d4a017" font-weight="400">le lot</text>
<rect x="280" y="120" width="220" height="220" rx="14" fill="#ffffff" stroke="#0f4c4c" stroke-width="3"/>
<text x="390" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#122a2a" font-weight="700">Synchro</text>
<text x="390" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a6e6e" font-weight="400">courte et frequente</text>
<rect x="510" y="120" width="220" height="220" rx="14" fill="#e8f2ef" stroke="#d4a017" stroke-width="3"/>
<text x="620" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7a5a0a" font-weight="700">Revue</text>
<text x="620" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a5a0a" font-weight="400">on montre</text>
<rect x="740" y="120" width="210" height="220" rx="14" fill="#d4a017" stroke="#d4a017" stroke-width="3"/>
<text x="845" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#122a2a" font-weight="700">Retro</text>
<text x="845" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#122a2a" font-weight="400">on s'ameliore</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5a6e6e" font-weight="400">But clair + duree courte. Sinon, ce n'est pas une ceremonie.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f3f6f2"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#14261c" font-weight="700">Cles : identifier et relier</text>
<rect x="80" y="140" width="400" height="240" rx="14" fill="#dcfce7" stroke="#14261c" stroke-width="3"/>
<text x="280" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#14261c" font-weight="700">Cle primaire</text>
<text x="280" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#14261c" font-weight="700">clients.id</text>
<text x="280" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a6e62" font-weight="400">unique par ligne</text>
<rect x="520" y="140" width="400" height="240" rx="14" fill="#fef9c3" stroke="#84cc16" stroke-width="3"/>
<text x="720" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#3f6212" font-weight="700">Cle etrangere</text>
<text x="720" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="400">commandes.client_id</text>
<text x="720" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3f6212" font-weight="400">pointe vers clients.id</text>
<text x="500" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a6e62" font-weight="400">Sans cles claires, les JOIN deviennent flous.</text>
</svg>

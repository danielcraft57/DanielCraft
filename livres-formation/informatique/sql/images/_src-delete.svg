<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f3f6f2"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#14261c" font-weight="700">DELETE : retirer des lignes</text>
<rect x="150" y="130" width="700" height="220" rx="14" fill="#fef9c3" stroke="#84cc16" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#3f6212" font-weight="700">DELETE FROM commandes</text>
<text x="500" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#3f6212" font-weight="700">WHERE id = 42;</text>
<text x="500" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3f6212" font-weight="400">Sans WHERE : risque de tout effacer.</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a6e62" font-weight="400">Reflexe : SELECT d'abord, DELETE ensuite.</text>
</svg>

<rect x="200" y="160" width="400" height="50" rx="10" fill="#2a1d4a" stroke="#a78bfa" stroke-width="2"/><text x="400" y="190" text-anchor="middle" fill="#f4f2fa" font-size="15" font-family="Arial">catch (Exception $e)</text>

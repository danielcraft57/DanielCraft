<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="800" height="480" fill="#1a1033"/><defs><marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7e739a"/></marker></defs><text x="400" y="38" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Arial">try / catch / throw</text><rect x="200" y="70" width="400" height="50" rx="10" fill="#2a1d4a" stroke="#a78bfa" stroke-width="2"/><text x="400" y="100" text-anchor="middle" fill="#f4f2fa" font-size="15" font-family="Arial">try { code risque }</text>

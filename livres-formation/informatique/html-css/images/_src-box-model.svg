<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <rect width="1000" height="720" fill="#f7f4ef"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1a4d3e" font-weight="700">Le modele en boite (CSS)</text>

  <!-- MARGE -->
  <rect x="80" y="90" width="840" height="560" rx="18" fill="#f3e7a8" stroke="#c9a227" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="110" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a6410" font-weight="700">MARGE</text>

  <!-- BORDURE -->
  <rect x="160" y="160" width="680" height="420" rx="14" fill="#d9dde3" stroke="#5c6570" stroke-width="10"/>
  <text x="190" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#3d454e" font-weight="700">BORDURE</text>

  <!-- PADDING -->
  <rect x="230" y="230" width="540" height="280" rx="12" fill="#cfe3f5" stroke="#4a7aa8" stroke-width="3"/>
  <text x="260" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#2f5678" font-weight="700">PADDING</text>

  <!-- CONTENU -->
  <rect x="320" y="300" width="360" height="140" rx="10" fill="#bfe3cf" stroke="#1a4d3e" stroke-width="3"/>
  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1a4d3e" font-weight="700">CONTENU</text>
</svg>

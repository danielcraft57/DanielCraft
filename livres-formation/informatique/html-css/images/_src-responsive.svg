<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#f7f4ef"/>
  <text x="550" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1a4d3e" font-weight="700">Le site s'adapte a l'ecran</text>

  <!-- Desktop -->
  <text x="250" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#266b56" font-weight="700">Grand ecran</text>
  <rect x="70" y="120" width="360" height="420" rx="16" fill="#ffffff" stroke="#1a4d3e" stroke-width="3"/>
  <rect x="95" y="150" width="310" height="50" rx="8" fill="#1a4d3e"/>
  <text x="250" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#f4faf7">En-tete</text>
  <rect x="95" y="220" width="145" height="280" rx="8" fill="#cfe3f5"/>
  <text x="167" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2f5678">Colonne 1</text>
  <rect x="260" y="220" width="145" height="280" rx="8" fill="#bfe3cf"/>
  <text x="332" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e">Colonne 2</text>

  <!-- Arrow -->
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c9a227"/>
    </marker>
  </defs>
  <line x1="470" y1="330" x2="620" y2="330" stroke="#c9a227" stroke-width="5" marker-end="url(#arrow2)"/>
  <text x="545" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8a7018" font-weight="700">s'adapte</text>

  <!-- Phone -->
  <text x="820" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#266b56" font-weight="700">Telephone</text>
  <rect x="700" y="120" width="240" height="420" rx="28" fill="#ffffff" stroke="#1a4d3e" stroke-width="3"/>
  <rect x="725" y="150" width="190" height="45" rx="8" fill="#1a4d3e"/>
  <text x="820" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#f4faf7">En-tete</text>
  <rect x="725" y="215" width="190" height="90" rx="8" fill="#cfe3f5"/>
  <text x="820" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2f5678">Bloc 1</text>
  <rect x="725" y="320" width="190" height="90" rx="8" fill="#bfe3cf"/>
  <text x="820" y="373" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a4d3e">Bloc 2</text>
  <rect x="725" y="425" width="190" height="80" rx="8" fill="#f0d9b5"/>
  <text x="820" y="472" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a4d14">Bloc 3</text>
</svg>

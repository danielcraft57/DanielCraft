  </defs>
  <path d="M280 190 C330 150, 360 150, 390 190" fill="none" stroke="#3d52b8" stroke-width="2.5" marker-end="url(#am)" opacity="0.4"/>
  <path d="M280 220 C420 280, 620 280, 720 220" fill="none" stroke="#2a3a8f" stroke-width="3" marker-end="url(#am)"/>
  <path d="M610 220 C650 250, 680 250, 720 220" fill="none" stroke="#2a3a8f" stroke-width="3" marker-end="url(#am)"/>
  <text x="500" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3d52b8" font-weight="700">import � export</text>

  <text x="500" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#14182a">On decoupe le code : plus clair, plus facile a relire.</text>

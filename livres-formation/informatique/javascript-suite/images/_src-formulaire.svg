<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f3f5fa"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2a3a8f" font-weight="700">Valider avant d'envoyer</text>

  <!-- Formulaire -->
  <rect x="60" y="80" width="380" height="280" rx="16" fill="#ffffff" stroke="#2a3a8f" stroke-width="3"/>
  <text x="250" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#2a3a8f" font-weight="700">Formulaire</text>

  <text x="90" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#14182a">E-mail</text>
  <rect x="90" y="170" width="320" height="36" rx="8" fill="#f3f5fa" stroke="#3d52b8" stroke-width="2"/>
  <text x="105" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3d52b8">alice@exemple.fr</text>

  <text x="90" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#14182a">Message</text>
  <rect x="90" y="250" width="320" height="50" rx="8" fill="#f3f5fa" stroke="#3d52b8" stroke-width="2"/>
  <text x="105" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3d52b8">Bonjour...</text>

  <rect x="90" y="318" width="140" height="28" rx="8" fill="#a8e063"/>
  <text x="160" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#14182a" font-weight="700">Envoyer</text>

  <!-- Fleche -->
  <defs>
    <marker id="af" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2a3a8f"/>
    </marker>
  </defs>
  <line x1="460" y1="220" x2="540" y2="220" stroke="#2a3a8f" stroke-width="5" marker-end="url(#af)"/>
  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3d52b8">controle</text>

  <!-- Resultats -->
  <rect x="560" y="80" width="380" height="120" rx="14" fill="#e8f8d4" stroke="#2a3a8f" stroke-width="3"/>
  <circle cx="600" cy="120" r="18" fill="#a8e063"/>
  <path d="M592 120 L598 126 L610 112" fill="none" stroke="#2a3a8f" stroke-width="3" stroke-linecap="round"/>
  <text x="740" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#14182a" font-weight="700">OK : on envoie</text>
  <text x="740" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2a3a8f">champs corrects</text>

  <rect x="560" y="230" width="380" height="130" rx="14" fill="#ffffff" stroke="#2a3a8f" stroke-width="3"/>
  <circle cx="600" cy="275" r="18" fill="#2a3a8f"/>
  <text x="600" y="281" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a8e063" font-weight="700">!</text>
  <text x="740" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#14182a" font-weight="700">Erreur claire</text>
  <text x="740" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3d52b8">� E-mail invalide �</text>
</svg>

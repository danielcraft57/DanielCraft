<rect x="200" y="230" width="400" height="45" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="400" y="257" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">&amp; emprunte, &amp;mut emprunte mutable</text>

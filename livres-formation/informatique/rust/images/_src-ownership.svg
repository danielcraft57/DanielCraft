<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="800" height="480" fill="#1a1210"/><defs><marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8b7355"/></marker></defs><text x="400" y="38" text-anchor="middle" fill="#e8590c" font-size="20" font-weight="bold" font-family="Arial">Ownership : le coeur de Rust</text><rect x="200" y="60" width="400" height="45" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="400" y="87" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">Chaque valeur = 1 proprietaire</text>

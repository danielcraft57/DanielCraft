<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="800" height="480" fill="#1a1210"/><defs><marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8b7355"/></marker></defs><text x="400" y="38" text-anchor="middle" fill="#e8590c" font-size="20" font-weight="bold" font-family="Arial">loop / while / for in</text><rect x="80" y="80" width="250" height="55" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="205" y="112" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">loop { break; }</text>
<rect x="80" y="180" width="250" height="55" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="205" y="212" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">while condition { }</text>
<rect x="80" y="280" width="250" height="55" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="205" y="312" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">for i in 0..n { }</text>
<rect x="450" y="80" width="250" height="55" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="575" y="112" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">Infini + retour valeur</text>
<rect x="450" y="180" width="250" height="55" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="575" y="212" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">Condition d'arret</text>
<rect x="450" y="280" width="250" height="55" rx="10" fill="#2e1e14" stroke="#e8590c" stroke-width="2"/><text x="575" y="312" text-anchor="middle" fill="#faf5f0" font-size="15" font-family="Arial">Range / collection</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<rect width="1000" height="460" fill="#eef2f6"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#243447" font-weight="700">Erreurs HTTP : lire le code</text>
<rect x="80" y="100" width="260" height="240" rx="14" fill="#ffffff" stroke="#243447" stroke-width="3"/>
<text x="210" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#7dcea0" font-weight="700">200</text>
<text x="210" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5dade2" font-weight="400">OK</text>
<rect x="370" y="100" width="260" height="240" rx="14" fill="#d5e8f7" stroke="#243447" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#243447" font-weight="700">404</text>
<text x="500" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5dade2" font-weight="400">introuvable</text>
<rect x="660" y="100" width="260" height="240" rx="14" fill="#7dcea0" stroke="#243447" stroke-width="3"/>
<text x="790" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#243447" font-weight="700">500</text>
<text x="790" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#243447" font-weight="400">serveur</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5dade2" font-weight="400">Le code dit ou chercher avant de paniquer.</text>
</svg>

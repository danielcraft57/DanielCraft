<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef2f6"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#243447" font-weight="700">Mini-projet : tout assembler</text>

  <!-- Etape 1 -->
  <rect x="30" y="90" width="170" height="230" rx="14" fill="#243447"/>
  <text x="115" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7dcea0" font-weight="700">1. Donnees</text>
  <text x="115" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#eef2f6">CSV</text>
  <text x="115" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#eef2f6">ou API</text>
  <text x="115" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2">entrer</text>

  <defs>
    <marker id="apr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243447"/>
    </marker>
  </defs>
  <line x1="215" y1="200" x2="255" y2="200" stroke="#243447" stroke-width="4" marker-end="url(#apr)"/>

  <!-- Etape 2 -->
  <rect x="270" y="90" width="170" height="230" rx="14" fill="#ffffff" stroke="#243447" stroke-width="3"/>
  <text x="355" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#243447" font-weight="700">2. Script</text>
  <text x="355" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1a2332">Path</text>
  <text x="355" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1a2332">csv</text>
  <text x="355" y="245" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1a2332">requests</text>
  <text x="355" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2">traiter</text>

  <line x1="455" y1="200" x2="495" y2="200" stroke="#243447" stroke-width="4" marker-end="url(#apr)"/>

  <!-- Etape 3 -->
  <rect x="510" y="90" width="170" height="230" rx="14" fill="#ffffff" stroke="#243447" stroke-width="3"/>
  <text x="595" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#243447" font-weight="700">3. CLI</text>
  <text x="595" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332">options</text>
  <text x="595" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332">messages</text>
  <text x="595" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2">lancer</text>

  <line x1="695" y1="200" x2="735" y2="200" stroke="#243447" stroke-width="4" marker-end="url(#apr)"/>

  <!-- Etape 4 -->
  <rect x="750" y="90" width="220" height="230" rx="14" fill="#7dcea0" stroke="#243447" stroke-width="3"/>
  <text x="860" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332" font-weight="700">4. Resultat</text>
  <rect x="780" y="165" width="160" height="36" rx="8" fill="#ffffff"/>
  <text x="860" y="189" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#243447">rapport.txt</text>
  <rect x="780" y="215" width="160" height="36" rx="8" fill="#243447"/>
  <text x="860" y="239" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dcea0">resume terminal</text>
  <text x="860" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332">livrer</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1a2332">Lire, traiter, lancer : le cycle d'un vrai petit outil.</text>
</svg>

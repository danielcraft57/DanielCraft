<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="45%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#2f4258"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dcea0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7dcea0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1400" fill="url(#bg)"/>
  <circle cx="820" cy="180" r="220" fill="url(#glow)"/>
  <circle cx="140" cy="1220" r="180" fill="#7dcea0" opacity="0.12"/>
  <circle cx="160" cy="260" r="70" fill="#5dade2" opacity="0.2"/>

  <!-- Cadre papier -->
  <rect x="90" y="240" width="820" height="620" rx="24" fill="#eef2f6" opacity="0.08"/>
  <rect x="120" y="270" width="760" height="560" rx="20" fill="#eef2f6"/>

  <!-- Schema stylise : script / API / JSON -->
  <rect x="170" y="340" width="200" height="280" rx="14" fill="#ffffff" stroke="#243447" stroke-width="3"/>
  <rect x="170" y="340" width="200" height="48" rx="14" fill="#243447"/>
  <rect x="170" y="372" width="200" height="16" fill="#243447"/>
  <text x="270" y="372" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7dcea0" font-weight="700">Script</text>
  <rect x="200" y="420" width="140" height="24" rx="5" fill="#eef2f6"/>
  <rect x="200" y="460" width="110" height="24" rx="5" fill="#eef2f6"/>
  <rect x="200" y="510" width="140" height="36" rx="8" fill="#7dcea0"/>
  <text x="270" y="534" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332" font-weight="700">lancer</text>

  <line x1="390" y1="480" x2="470" y2="480" stroke="#243447" stroke-width="5" stroke-linecap="round"/>
  <polygon points="470,470 495,480 470,490" fill="#243447"/>

  <rect x="510" y="360" width="220" height="240" rx="16" fill="#243447"/>
  <circle cx="620" cy="450" r="40" fill="#5dade2"/>
  <text x="620" y="457" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332" font-weight="700">API</text>
  <rect x="570" y="510" width="100" height="40" rx="8" fill="#7dcea0"/>
  <text x="620" y="536" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332" font-weight="700">JSON</text>

  <!-- Badges themes -->
  <rect x="170" y="740" width="130" height="40" rx="10" fill="#243447"/>
  <text x="235" y="766" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dcea0" font-weight="700">Path</text>
  <rect x="320" y="740" width="130" height="40" rx="10" fill="#243447"/>
  <text x="385" y="766" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dcea0" font-weight="700">CSV</text>
  <rect x="470" y="740" width="130" height="40" rx="10" fill="#243447"/>
  <text x="535" y="766" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dcea0" font-weight="700">CLI</text>
  <rect x="620" y="740" width="160" height="40" rx="10" fill="#7dcea0"/>
  <text x="700" y="766" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332" font-weight="700">requests</text>

  <!-- Titre -->
  <text x="500" y="1020" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" fill="#eef2f6" font-weight="700">Python - Pratique</text>
  <text x="500" y="1100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7dcea0">Fichiers, CLI, API et environnements</text>
  <text x="500" y="1220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#7dcea0" font-weight="700">DanielCraft</text>
  <text x="500" y="1285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#eef2f6" opacity="0.75">Formation pratique</text>
</svg>

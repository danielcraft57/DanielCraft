<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#eef2f6"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#243447" font-weight="700">Tests simples</text>
<rect x="150" y="120" width="700" height="220" rx="14" fill="#ffffff" stroke="#243447" stroke-width="3"/>
<text x="500" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#243447" font-weight="700">assert resultat == attendu</text>
<text x="500" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5dade2" font-weight="400">pytest / unittest</text>
<text x="500" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5dade2" font-weight="400">protege contre les regressions</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5dade2" font-weight="400">Un petit test vaut une longue peur.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef2f6"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#243447" font-weight="700">Ligne de commande : tu lances, Python repond</text>

  <!-- Terminal -->
  <rect x="50" y="90" width="420" height="240" rx="16" fill="#1a2332"/>
  <circle cx="80" cy="120" r="7" fill="#7dcea0"/>
  <circle cx="105" cy="120" r="7" fill="#5dade2"/>
  <circle cx="130" cy="120" r="7" fill="#eef2f6" opacity="0.5"/>
  <text x="260" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dcea0">Terminal</text>
  <text x="80" y="175" font-family="Consolas, monospace" font-size="16" fill="#7dcea0">$</text>
  <text x="105" y="175" font-family="Consolas, monospace" font-size="16" fill="#eef2f6">python outil.py</text>
  <text x="105" y="210" font-family="Consolas, monospace" font-size="16" fill="#5dade2">--fichier notes.csv</text>
  <text x="80" y="255" font-family="Consolas, monospace" font-size="15" fill="#7dcea0">&gt;</text>
  <text x="105" y="255" font-family="Consolas, monospace" font-size="15" fill="#eef2f6">3 lignes lues</text>
  <text x="105" y="290" font-family="Consolas, monospace" font-size="15" fill="#eef2f6">moyenne = 16</text>

  <defs>
    <marker id="acl" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243447"/>
    </marker>
  </defs>
  <line x1="490" y1="200" x2="560" y2="200" stroke="#243447" stroke-width="4" marker-end="url(#acl)"/>
  <text x="525" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2" font-weight="700">args</text>

  <!-- Script -->
  <rect x="580" y="90" width="380" height="240" rx="16" fill="#ffffff" stroke="#243447" stroke-width="3"/>
  <rect x="580" y="90" width="380" height="48" rx="16" fill="#243447"/>
  <rect x="580" y="122" width="380" height="16" fill="#243447"/>
  <text x="770" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7dcea0" font-weight="700">Script Python</text>

  <rect x="610" y="165" width="150" height="50" rx="10" fill="#7dcea0"/>
  <text x="685" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a2332" font-weight="700">arguments</text>

  <rect x="780" y="165" width="150" height="50" rx="10" fill="#5dade2"/>
  <text x="855" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a2332" font-weight="700">options</text>

  <rect x="610" y="240" width="320" height="55" rx="10" fill="#eef2f6"/>
  <text x="770" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#243447" font-weight="700">argparse / sys.argv</text>
  <text x="770" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5dade2">lire ce que tu as tape</text>

  <text x="500" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1a2332">Un outil utile se lance depuis le terminal, avec des options.</text>
</svg>

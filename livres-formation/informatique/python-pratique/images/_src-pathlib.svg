<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef2f6"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#243447" font-weight="700">Pathlib : un chemin, un objet Path</text>

  <!-- Dossier racine -->
  <rect x="40" y="100" width="220" height="210" rx="14" fill="#243447"/>
  <rect x="70" y="140" width="160" height="28" rx="6" fill="#7dcea0"/>
  <text x="150" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a2332" font-weight="700">projet/</text>
  <rect x="90" y="185" width="120" height="22" rx="4" fill="#5dade2" opacity="0.85"/>
  <text x="150" y="201" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a2332">data/</text>
  <rect x="90" y="220" width="120" height="22" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="150" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#243447">scripts/</text>
  <text x="150" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7dcea0" font-weight="700">Dossier</text>

  <defs>
    <marker id="ap" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243447"/>
    </marker>
  </defs>
  <line x1="280" y1="200" x2="360" y2="200" stroke="#243447" stroke-width="4" marker-end="url(#ap)"/>
  <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2" font-weight="700">Path</text>

  <!-- Objet Path -->
  <rect x="380" y="100" width="260" height="210" rx="14" fill="#ffffff" stroke="#243447" stroke-width="3"/>
  <rect x="380" y="100" width="260" height="44" rx="14" fill="#243447"/>
  <rect x="380" y="128" width="260" height="16" fill="#243447"/>
  <text x="510" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7dcea0" font-weight="700">Path(...)</text>
  <text x="510" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1a2332">.name</text>
  <text x="510" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1a2332">.parent</text>
  <text x="510" y="245" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1a2332">.exists()</text>
  <text x="510" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2">objet chemin</text>

  <line x1="660" y1="200" x2="740" y2="200" stroke="#243447" stroke-width="4" marker-end="url(#ap)"/>
  <text x="700" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2" font-weight="700">ouvrir</text>

  <!-- Fichier cible -->
  <rect x="760" y="100" width="200" height="210" rx="14" fill="#7dcea0" stroke="#243447" stroke-width="3"/>
  <rect x="800" y="145" width="120" height="100" rx="8" fill="#ffffff"/>
  <text x="860" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#243447" font-weight="700">notes</text>
  <text x="860" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#243447">.csv</text>
  <text x="860" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a2332" font-weight="700">Fichier</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1a2332">Plus de chaines fragiles : Path construit et lit les chemins.</text>
</svg>

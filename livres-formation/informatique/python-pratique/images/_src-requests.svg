<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef2f6"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#243447" font-weight="700">Script - API - reponse JSON</text>

  <!-- Script -->
  <rect x="40" y="100" width="240" height="220" rx="16" fill="#ffffff" stroke="#243447" stroke-width="3"/>
  <rect x="40" y="100" width="240" height="48" rx="16" fill="#243447"/>
  <rect x="40" y="132" width="240" height="16" fill="#243447"/>
  <text x="160" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7dcea0" font-weight="700">Ton script</text>
  <rect x="70" y="175" width="180" height="28" rx="6" fill="#eef2f6"/>
  <rect x="70" y="220" width="140" height="28" rx="6" fill="#eef2f6"/>
  <rect x="70" y="265" width="180" height="28" rx="6" fill="#7dcea0"/>
  <text x="160" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332" font-weight="700">requests.get</text>

  <defs>
    <marker id="ar1" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243447"/>
    </marker>
    <marker id="ar2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5dade2"/>
    </marker>
  </defs>
  <line x1="300" y1="180" x2="400" y2="180" stroke="#243447" stroke-width="4" marker-end="url(#ar1)"/>
  <text x="350" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#243447" font-weight="700">Requete</text>

  <!-- API -->
  <rect x="420" y="100" width="240" height="220" rx="16" fill="#243447"/>
  <circle cx="540" cy="175" r="36" fill="#5dade2"/>
  <text x="540" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332" font-weight="700">API</text>
  <rect x="490" y="225" width="100" height="40" rx="8" fill="#7dcea0"/>
  <text x="540" y="251" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332" font-weight="700">serveur</text>
  <text x="540" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7dcea0" font-weight="700">Web</text>

  <line x1="680" y1="240" x2="780" y2="240" stroke="#5dade2" stroke-width="4" marker-end="url(#ar2)"/>
  <text x="730" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5dade2" font-weight="700">Reponse</text>

  <!-- JSON -->
  <rect x="800" y="100" width="160" height="220" rx="16" fill="#ffffff" stroke="#7dcea0" stroke-width="4"/>
  <text x="880" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#243447" font-weight="700">JSON</text>
  <text x="880" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332">donnees</text>
  <text x="880" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a2332">pretes</text>
  <text x="880" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#5dade2">{ ... }</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1a2332">Ton script demande, l'API repond, tu exploites le JSON.</text>
</svg>

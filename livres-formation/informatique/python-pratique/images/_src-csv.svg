<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef2f6"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#243447" font-weight="700">CSV : un tableau dans un fichier texte</text>

  <!-- Tableau -->
  <rect x="60" y="90" width="520" height="250" rx="14" fill="#ffffff" stroke="#243447" stroke-width="3"/>
  <rect x="60" y="90" width="520" height="48" rx="14" fill="#243447"/>
  <rect x="60" y="122" width="520" height="16" fill="#243447"/>
  <text x="145" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7dcea0" font-weight="700">nom</text>
  <text x="300" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7dcea0" font-weight="700">ville</text>
  <text x="470" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7dcea0" font-weight="700">score</text>

  <line x1="210" y1="90" x2="210" y2="340" stroke="#eef2f6" stroke-width="2"/>
  <line x1="390" y1="90" x2="390" y2="340" stroke="#eef2f6" stroke-width="2"/>
  <line x1="60" y1="175" x2="580" y2="175" stroke="#eef2f6" stroke-width="2"/>
  <line x1="60" y1="230" x2="580" y2="230" stroke="#eef2f6" stroke-width="2"/>
  <line x1="60" y1="285" x2="580" y2="285" stroke="#eef2f6" stroke-width="2"/>

  <text x="145" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">Ada</text>
  <text x="300" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">Lyon</text>
  <text x="470" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">18</text>

  <rect x="70" y="240" width="500" height="40" fill="#7dcea0" opacity="0.35"/>
  <text x="145" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">Bob</text>
  <text x="300" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">Nantes</text>
  <text x="470" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">14</text>

  <text x="145" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">Lea</text>
  <text x="300" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">Lille</text>
  <text x="470" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1a2332">16</text>

  <!-- Fleche -->
  <defs>
    <marker id="ac" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243447"/>
    </marker>
  </defs>
  <line x1="600" y1="210" x2="680" y2="210" stroke="#243447" stroke-width="4" marker-end="url(#ac)"/>
  <text x="640" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5dade2" font-weight="700">csv</text>

  <!-- Fichier texte -->
  <rect x="700" y="90" width="260" height="250" rx="14" fill="#243447"/>
  <text x="830" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7dcea0" font-weight="700">fichier.csv</text>
  <text x="730" y="175" font-family="Consolas, monospace" font-size="14" fill="#eef2f6">nom,ville,score</text>
  <text x="730" y="210" font-family="Consolas, monospace" font-size="14" fill="#7dcea0">Ada,Lyon,18</text>
  <text x="730" y="245" font-family="Consolas, monospace" font-size="14" fill="#5dade2">Bob,Nantes,14</text>
  <text x="730" y="280" font-family="Consolas, monospace" font-size="14" fill="#eef2f6">Lea,Lille,16</text>
  <text x="830" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dcea0">lignes + virgules</text>

  <text x="500" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1a2332">Lire une ligne, ecrire une ligne : le format le plus simple.</text>
</svg>

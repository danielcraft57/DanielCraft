<text x="380" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b2d42" font-weight="700">log / status</text>
<rect x="500" y="90" width="200" height="100" rx="14" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b2d42" font-weight="700">branches</text>

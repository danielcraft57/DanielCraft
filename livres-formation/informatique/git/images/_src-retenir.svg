<rect x="60" y="90" width="200" height="100" rx="14" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<text x="160" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b2d42" font-weight="700">init/add/commit</text>

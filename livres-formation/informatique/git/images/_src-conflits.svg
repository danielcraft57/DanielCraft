<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<rect width="1000" height="460" fill="#f7f4f2"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2b2d42" font-weight="700">Conflit : deux versions du meme endroit</text>
<rect x="100" y="120" width="350" height="220" rx="14" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<text x="275" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2b2d42" font-weight="700">ta version</text>
<rect x="550" y="120" width="350" height="220" rx="14" fill="#e8e6f0" stroke="#2b2d42" stroke-width="3"/>
<text x="725" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2b2d42" font-weight="700">autre version</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5c5c66" font-weight="400">Choisir, nettoyer, puis commit.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#f7f4f2"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2b2d42" font-weight="700">Stash et undo</text>
<rect x="120" y="120" width="350" height="220" rx="14" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<text x="295" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#2b2d42" font-weight="700">stash</text>
<text x="295" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c5c66" font-weight="400">mettre de cote</text>
<rect x="530" y="120" width="350" height="220" rx="14" fill="#e8e6f0" stroke="#2b2d42" stroke-width="3"/>
<text x="705" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#2b2d42" font-weight="700">undo</text>

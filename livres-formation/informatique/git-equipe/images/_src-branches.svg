<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#dfe6e9"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2d3436" font-weight="700">Branches : travailler cote a cote</text>

  <!-- ligne principale -->
  <line x1="80" y1="280" x2="900" y2="280" stroke="#2d3436" stroke-width="8"/>
  <text x="100" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2d3436" font-weight="700">principale</text>

  <circle cx="200" cy="280" r="14" fill="#2d3436"/>
  <circle cx="380" cy="280" r="14" fill="#2d3436"/>
  <circle cx="700" cy="280" r="14" fill="#2d3436"/>
  <circle cx="860" cy="280" r="14" fill="#2d3436"/>

  <!-- branche A (ambre) -->
  <path d="M380 280 C430 280, 430 140, 500 140 L720 140" fill="none" stroke="#e17055" stroke-width="7"/>
  <circle cx="500" cy="140" r="14" fill="#e17055"/>
  <circle cx="620" cy="140" r="14" fill="#e17055"/>
  <circle cx="720" cy="140" r="14" fill="#e17055"/>
  <text x="520" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e17055" font-weight="700">fonction A</text>
  <text x="520" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#636e72">toi</text>

  <!-- branche B (menthe) -->
  <path d="M380 280 C440 280, 440 360, 520 360 L740 360" fill="none" stroke="#55efc4" stroke-width="7"/>
  <circle cx="520" cy="360" r="14" fill="#2d3436" stroke="#55efc4" stroke-width="4"/>
  <circle cx="640" cy="360" r="14" fill="#2d3436" stroke="#55efc4" stroke-width="4"/>
  <circle cx="740" cy="360" r="14" fill="#2d3436" stroke="#55efc4" stroke-width="4"/>
  <text x="540" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d3436" font-weight="700">fonction B</text>
  <text x="680" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#636e72">un collegue</text>

  <text x="500" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#636e72">Chacun avance sans casser la ligne stable.</text>
</svg>

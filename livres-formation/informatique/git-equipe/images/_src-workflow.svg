<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#dfe6e9"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2d3436" font-weight="700">Workflow : fonction, demande, puis principale</text>

  <defs>
    <marker id="aw" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2d3436"/>
    </marker>
  </defs>

  <rect x="40" y="100" width="250" height="200" rx="16" fill="#2d3436"/>
  <text x="165" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#55efc4" font-weight="700">1. Fonction</text>
  <text x="165" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">branche</text>
  <text x="165" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#dfe6e9">ton travail isole</text>
  <text x="165" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#55efc4">creer, committer</text>

  <line x1="305" y1="200" x2="355" y2="200" stroke="#2d3436" stroke-width="4" marker-end="url(#aw)"/>

  <rect x="370" y="100" width="250" height="200" rx="16" fill="#e17055"/>
  <text x="495" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2d3436" font-weight="700">2. Demande</text>
  <text x="495" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">revue</text>
  <text x="495" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d3436">discuter, corriger</text>
  <text x="495" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3436">avant de fusionner</text>

  <line x1="635" y1="200" x2="685" y2="200" stroke="#2d3436" stroke-width="4" marker-end="url(#aw)"/>

  <rect x="700" y="100" width="260" height="200" rx="16" fill="#ffffff" stroke="#2d3436" stroke-width="3"/>
  <text x="830" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e17055" font-weight="700">3. Principale</text>
  <text x="830" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#2d3436" font-weight="700">stable</text>
  <text x="830" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#636e72">equipe alignee</text>
  <text x="830" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#55efc4">fusion apres OK</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d3436">On ne pousse pas direct sur principale : on demande d'abord.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#dfe6e9"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2d3436" font-weight="700">Integration continue : pousser, tester, savoir</text>

  <defs>
    <marker id="ai" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2d3436"/>
    </marker>
  </defs>

  <rect x="40" y="100" width="200" height="200" rx="16" fill="#2d3436"/>
  <text x="140" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#55efc4" font-weight="700">1. Pousser</text>
  <text x="140" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">ton code</text>
  <text x="140" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dfe6e9">vers le depot</text>

  <line x1="255" y1="200" x2="295" y2="200" stroke="#2d3436" stroke-width="4" marker-end="url(#ai)"/>

  <rect x="310" y="100" width="200" height="200" rx="16" fill="#ffffff" stroke="#2d3436" stroke-width="3"/>
  <text x="410" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d3436" font-weight="700">2. Machine</text>
  <text x="410" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e17055" font-weight="700">lance les tests</text>
  <text x="410" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#636e72">sans que tu cliques</text>

  <line x1="525" y1="200" x2="565" y2="200" stroke="#2d3436" stroke-width="4" marker-end="url(#ai)"/>

  <!-- deux sorties -->
  <rect x="580" y="80" width="180" height="110" rx="14" fill="#55efc4" stroke="#2d3436" stroke-width="2"/>
  <text x="670" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d3436" font-weight="700">Vert : OK</text>
  <text x="670" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3436">fusion possible</text>

  <rect x="580" y="220" width="180" height="110" rx="14" fill="#e17055" stroke="#2d3436" stroke-width="2"/>
  <text x="670" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">Rouge : echec</text>
  <text x="670" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3436">corriger d'abord</text>

  <line x1="775" y1="135" x2="820" y2="135" stroke="#2d3436" stroke-width="3" marker-end="url(#ai)"/>
  <line x1="775" y1="275" x2="820" y2="275" stroke="#2d3436" stroke-width="3" marker-end="url(#ai)"/>

  <rect x="830" y="100" width="140" height="200" rx="16" fill="#2d3436"/>
  <text x="900" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#55efc4" font-weight="700">Signal</text>
  <text x="900" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff">pour l'equipe</text>
  <text x="900" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dfe6e9">clair et rapide</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d3436">La CI te dit vite si le projet reste sain.</text>
</svg>

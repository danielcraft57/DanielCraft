<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef6f7"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0c4a5e" font-weight="700">Cascade : qui gagne quand les styles se croisent</text>

  <!-- Couches -->
  <rect x="50" y="80" width="420" height="70" rx="12" fill="#d4e8ec" stroke="#15657a" stroke-width="2"/>
  <text x="260" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#15657a" font-weight="700">1. Navigateur</text>
  <text x="260" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123038">styles par defaut</text>

  <rect x="50" y="165" width="420" height="70" rx="12" fill="#ffffff" stroke="#0c4a5e" stroke-width="3"/>
  <text x="260" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0c4a5e" font-weight="700">2. Feuille CSS</text>
  <text x="260" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#15657a">tes regles du fichier</text>

  <rect x="50" y="250" width="420" height="70" rx="12" fill="#0c4a5e"/>
  <text x="260" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2dd4bf" font-weight="700">3. Plus precis</text>
  <text x="260" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#eef6f7">classe, id, !important</text>

  <defs>
    <marker id="ac" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0c4a5e"/>
    </marker>
  </defs>
  <line x1="490" y1="200" x2="560" y2="200" stroke="#0c4a5e" stroke-width="4" marker-end="url(#ac)"/>
  <text x="525" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#15657a" font-weight="700">resultat</text>

  <!-- Resultat -->
  <rect x="580" y="100" width="370" height="220" rx="16" fill="#ffffff" stroke="#0c4a5e" stroke-width="3"/>
  <text x="765" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0c4a5e" font-weight="700">Style final</text>
  <rect x="620" y="170" width="290" height="50" rx="10" fill="#2dd4bf"/>
  <text x="765" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#123038" font-weight="700">le plus fort gagne</text>
  <text x="765" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#15657a">meme cible, plusieurs</text>
  <text x="765" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#15657a">regles : la cascade departage</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#123038">Comprendre la cascade, c'est predire le rendu.</text>
</svg>

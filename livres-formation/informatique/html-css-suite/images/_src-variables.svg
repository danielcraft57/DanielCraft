<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef6f7"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0c4a5e" font-weight="700">Variables CSS : une couleur, partout coherente</text>

  <rect x="40" y="80" width="280" height="250" rx="16" fill="#0c4a5e"/>
  <text x="180" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2dd4bf" font-weight="700">Racine</text>
  <rect x="70" y="155" width="220" height="50" rx="10" fill="#2dd4bf"/>
  <text x="180" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#123038" font-weight="700">couleur principale</text>
  <rect x="70" y="225" width="220" height="50" rx="10" fill="#15657a"/>
  <text x="180" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#eef6f7" font-weight="700">espace</text>
  <text x="180" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2dd4bf">definir une fois</text>

  <defs>
    <marker id="av" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0c4a5e"/>
    </marker>
  </defs>
  <line x1="340" y1="200" x2="400" y2="200" stroke="#0c4a5e" stroke-width="4" marker-end="url(#av)"/>
  <text x="370" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#15657a" font-weight="700">reutiliser</text>

  <rect x="420" y="80" width="540" height="250" rx="16" fill="#ffffff" stroke="#0c4a5e" stroke-width="3"/>
  <text x="690" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0c4a5e" font-weight="700">Sur la page</text>

  <rect x="450" y="150" width="150" height="90" rx="12" fill="#2dd4bf"/>
  <text x="525" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#123038" font-weight="700">Bouton</text>
  <text x="525" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0c4a5e">meme teinte</text>

  <rect x="620" y="150" width="150" height="90" rx="12" fill="#ffffff" stroke="#2dd4bf" stroke-width="4"/>
  <text x="695" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#123038" font-weight="700">Lien</text>
  <text x="695" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#15657a">meme teinte</text>

  <rect x="790" y="150" width="140" height="90" rx="12" fill="#0c4a5e"/>
  <text x="860" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2dd4bf" font-weight="700">Titre</text>
  <text x="860" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#eef6f7">meme teinte</text>

  <text x="690" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#15657a">Changer la racine = tout se met a jour</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#123038">Un seul endroit pour garder le theme coherent.</text>
</svg>

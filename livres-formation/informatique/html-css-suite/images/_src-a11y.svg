<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f3f0ea"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2c2118" font-weight="700">Accessibilite : pour tout le monde</text>

  <!-- Clavier -->
  <rect x="40" y="80" width="280" height="240" rx="16" fill="#ffffff" stroke="#2c2118" stroke-width="3"/>
  <circle cx="180" cy="140" r="32" fill="#2c2118"/>
  <text x="180" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a3b18a" font-weight="700">1</text>
  <text x="180" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f1a14" font-weight="700">Clavier</text>
  <text x="180" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a3b2e">tabulation</text>
  <text x="180" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a3b2e">focus visible</text>
  <text x="180" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2c2118">naviguer sans souris</text>

  <!-- Contraste -->
  <rect x="360" y="80" width="280" height="240" rx="16" fill="#ffffff" stroke="#2c2118" stroke-width="3"/>
  <circle cx="500" cy="140" r="32" fill="#2c2118"/>
  <text x="500" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a3b18a" font-weight="700">2</text>
  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f1a14" font-weight="700">Contraste</text>
  <rect x="420" y="220" width="70" height="40" rx="8" fill="#2c2118"/>
  <text x="455" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a3b18a" font-weight="700">Aa</text>
  <rect x="510" y="220" width="70" height="40" rx="8" fill="#e8e4dc"/>
  <text x="545" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b0a89c" font-weight="700">Aa</text>
  <text x="500" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2c2118">texte lisible</text>

  <!-- Texte alternatif -->
  <rect x="680" y="80" width="280" height="240" rx="16" fill="#a3b18a" stroke="#2c2118" stroke-width="3"/>
  <circle cx="820" cy="140" r="32" fill="#2c2118"/>
  <text x="820" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a3b18a" font-weight="700">3</text>
  <text x="820" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f1a14" font-weight="700">Images</text>
  <text x="820" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2118">texte alternatif</text>
  <text x="820" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2118">description utile</text>
  <text x="820" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f1a14">comprendre sans voir</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f1a14">Trois gestes simples pour une page plus accueillante.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f1f5f9"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="700">Union | et optionnel ?</text>
<rect x="80" y="140" width="400" height="240" rx="14" fill="#dbeafe" stroke="#0f172a" stroke-width="3"/>
<text x="280" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700">string | number</text>
<text x="280" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">soit l'un, soit l'autre</text>

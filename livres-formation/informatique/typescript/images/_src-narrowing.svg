<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f1f5f9"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="700">Narrowing : resserrer le type</text>
<rect x="300" y="100" width="400" height="90" rx="14" fill="#dbeafe" stroke="#0f172a" stroke-width="3"/>
<text x="500" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700">x: string | number</text>
<line x1="500" y1="190" x2="500" y2="240" stroke="#0f172a" stroke-width="3"/>
<line x1="250" y1="240" x2="750" y2="240" stroke="#0f172a" stroke-width="3"/>
<line x1="250" y1="240" x2="250" y2="290" stroke="#0f172a" stroke-width="3"/>
<line x1="750" y1="240" x2="750" y2="290" stroke="#0f172a" stroke-width="3"/>
<rect x="100" y="290" width="300" height="130" rx="14" fill="#dbeafe" stroke="#0f172a" stroke-width="3"/>
<text x="250" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700">typeof === "string"</text>
<text x="250" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">branche string</text>
<rect x="600" y="290" width="300" height="130" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<text x="750" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b45309" font-weight="700">sinon</text>
<text x="750" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b45309" font-weight="400">branche number</text>
<text x="500" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">Prouver avant d'appeler une methode.</text>

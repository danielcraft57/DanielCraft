<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f1f5f9"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="700">any vs unknown</text>
<rect x="80" y="140" width="400" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
<text x="280" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#0f172a" font-weight="700">any</text>
<text x="280" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">silence total</text>
<text x="280" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b91c1c" font-weight="400">bugs possibles</text>
<rect x="520" y="140" width="400" height="260" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<text x="720" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#b45309" font-weight="700">unknown</text>
<text x="720" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b45309" font-weight="400">preuve exigee</text>
<text x="720" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b45309" font-weight="400">+ narrowing</text>
<text x="500" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">Prefere unknown (ou un vrai type) a any.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="800" height="480" fill="#0c1a2e"/><defs><marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b8299"/></marker></defs><text x="400" y="38" text-anchor="middle" fill="#00add8" font-size="20" font-weight="bold" font-family="Arial">Fonctions et retours multiples</text><rect x="150" y="70" width="500" height="50" rx="10" fill="#152d4a" stroke="#00add8" stroke-width="2"/><text x="400" y="100" text-anchor="middle" fill="#f0f6fb" font-size="15" font-family="Arial">func nom(params) (retour, error)</text>
<line x1="400" y1="120" x2="400" y2="160" stroke="#6b8299" stroke-width="2" marker-end="url(#arr)"/>
<rect x="150" y="160" width="500" height="50" rx="10" fill="#152d4a" stroke="#00add8" stroke-width="2"/><text x="400" y="190" text-anchor="middle" fill="#f0f6fb" font-size="15" font-family="Arial">return valeur, nil</text>
<rect x="150" y="260" width="240" height="50" rx="10" fill="#152d4a" stroke="#00add8" stroke-width="2"/><text x="270" y="290" text-anchor="middle" fill="#f0f6fb" font-size="15" font-family="Arial">Retour simple</text>
<rect x="420" y="260" width="240" height="50" rx="10" fill="#152d4a" stroke="#00add8" stroke-width="2"/><text x="540" y="290" text-anchor="middle" fill="#f0f6fb" font-size="15" font-family="Arial">(valeur, erreur)</text>
<text x="400" y="390" text-anchor="middle" fill="#6b8299" font-size="14" font-family="Arial">Toujours verifier err != nil</text></svg>
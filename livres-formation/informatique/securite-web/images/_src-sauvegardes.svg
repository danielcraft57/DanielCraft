<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f8fafc"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#111827" font-weight="700">Sauvegardes</text>
<rect x="50" y="110" width="280" height="280" rx="14" fill="#ffedd5" stroke="#111827" stroke-width="3"/>
<text x="190" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" font-weight="700">Copies</text>
<text x="190" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b7280" font-weight="400">Plusieurs</text>
<text x="190" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b7280" font-weight="400">endroits</text>
<rect x="360" y="110" width="280" height="280" rx="14" fill="#e5e7eb" stroke="#fb923c" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#c2410c" font-weight="700">Test</text>
<text x="500" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="400">Restaurer</text>
<text x="500" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="400">une fois</text>
<rect x="670" y="110" width="280" height="280" rx="14" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<text x="810" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" font-weight="700">Hors site</text>
<text x="810" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b7280" font-weight="400">Pas tout</text>
<text x="810" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b7280" font-weight="400">au meme disque</text>
<text x="500" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7280" font-weight="400">Sauvegarde testee > sauvegarde theorique.</text>

<text x="500" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410" font-weight="400">src="app.js"</text>
<text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a6410" font-weight="400">propre pour un vrai projet</text>
<rect x="660" y="110" width="280" height="300" rx="14" fill="#ffffff" stroke="#1a4d3e" stroke-width="3"/>
<text x="800" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a4d3e" font-weight="700">Console</text>

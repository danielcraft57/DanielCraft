<text x="200" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#3d5248" font-weight="400"></script></text>
<text x="200" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3d5248" font-weight="400">rapide pour tester</text>

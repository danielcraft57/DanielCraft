<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f7f4ef"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a4d3e" font-weight="700">Modifier le DOM</text>
<rect x="80" y="140" width="260" height="220" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
<text x="210" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a4d3e" font-weight="700">1. Trouver</text>
<text x="210" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248" font-weight="400">querySelector</text>
<rect x="370" y="140" width="260" height="220" rx="14" fill="#fff4d6" stroke="#c9a227" stroke-width="3"/>
<text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a6410" font-weight="700">2. Changer</text>
<text x="500" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410" font-weight="400">textContent</text>
<text x="500" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410" font-weight="400">classList</text>
<rect x="660" y="140" width="260" height="220" rx="14" fill="#ffffff" stroke="#1a4d3e" stroke-width="3"/>
<text x="790" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a4d3e" font-weight="700">3. Voir</text>
<text x="790" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248" font-weight="400">la page change</text>
<text x="500" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248" font-weight="400">Trouver sans modifier = inutile. Modifier sans trouver = erreur.</text>
</svg>

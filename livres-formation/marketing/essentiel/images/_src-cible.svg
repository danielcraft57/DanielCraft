<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f2f8"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1f1630" font-weight="700">Parler a quelqu'un de precis</text>
<rect x="80" y="120" width="380" height="260" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="270" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1f1630" font-weight="700">Vague</text>
<text x="270" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a4d6a" font-weight="400">"j'aide tout le monde"</text>
<text x="270" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a4d6a" font-weight="400">personne ne se sent vise</text>
<rect x="540" y="120" width="380" height="260" rx="14" fill="#f3e6d8" stroke="#e8a87c" stroke-width="3"/>
<text x="730" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7a4a2a" font-weight="700">Precis</text>
<text x="730" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a4a2a" font-weight="400">parents, sport 20 min</text>
<text x="730" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a4a2a" font-weight="400">"c'est pour moi"</text>
<text x="500" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a4d6a" font-weight="400">Mieux : clair pour cent personnes que vague pour dix mille.</text>
</svg>

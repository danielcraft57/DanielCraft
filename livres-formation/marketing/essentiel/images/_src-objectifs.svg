<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f2f8"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1f1630" font-weight="700">Un objectif utile = 4 cases</text>
<rect x="60" y="120" width="210" height="200" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="165" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f1630" font-weight="700">Quoi ?</text>
<text x="165" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a4d6a" font-weight="400">contacts / ventes</text>
<rect x="290" y="120" width="210" height="200" rx="14" fill="#f3e6d8" stroke="#e8a87c" stroke-width="3"/>
<text x="395" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a4a2a" font-weight="700">Pour qui ?</text>
<text x="395" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a4a2a" font-weight="400">ta cible</text>
<rect x="520" y="120" width="210" height="200" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="625" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1f1630" font-weight="700">Quel chiffre ?</text>
<text x="625" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a4d6a" font-weight="400">signal mesurable</text>
<rect x="750" y="120" width="190" height="200" rx="14" fill="#e8a87c" stroke="#e8a87c" stroke-width="3"/>
<text x="845" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f1630" font-weight="700">D'ici quand ?</text>
<text x="845" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f1630" font-weight="400">une date</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a4d6a" font-weight="400">Une aiguille. Pas dix. Relis avant chaque action.</text>
</svg>

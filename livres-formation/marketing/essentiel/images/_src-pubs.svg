<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f2f8"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1f1630" font-weight="700">Pub = megaphone sur un pont solide</text>
<rect x="60" y="140" width="200" height="200" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="160" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1f1630" font-weight="700">Message</text>
<text x="160" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a4d6a" font-weight="400">1 phrase</text>
<rect x="280" y="140" width="200" height="200" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="380" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1f1630" font-weight="700">Page</text>
<text x="380" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a4d6a" font-weight="400">contact clair</text>
<rect x="500" y="140" width="200" height="200" rx="14" fill="#f3e6d8" stroke="#e8a87c" stroke-width="3"/>
<text x="600" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a4a2a" font-weight="700">Budget max</text>
<text x="600" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7a4a2a" font-weight="400">sans risque loyer</text>
<rect x="720" y="140" width="220" height="200" rx="14" fill="#e8a87c" stroke="#e8a87c" stroke-width="3"/>
<text x="830" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1f1630" font-weight="700">Signal</text>
<text x="830" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f1630" font-weight="400">appels / devis</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a4d6a" font-weight="400">4 cases remplies = pret a tester petit.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f6f2f8"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1f1630" font-weight="700">Le marketing, c'est plus que de la pub</text>
  <rect x="60" y="110" width="200" height="130" rx="12" fill="#3d2c5e"/>
  <text x="160" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff" font-weight="700">Comprendre</text>
  <text x="160" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e8a87c">le besoin</text>
  <rect x="280" y="110" width="200" height="130" rx="12" fill="#3d2c5e"/>
  <text x="380" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff" font-weight="700">Parler clair</text>
  <text x="380" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e8a87c">message + preuve</text>
  <rect x="500" y="110" width="200" height="130" rx="12" fill="#3d2c5e"/>
  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff" font-weight="700">Etre visible</text>
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e8a87c">canaux utiles</text>
  <rect x="720" y="110" width="220" height="130" rx="12" fill="#e8a87c"/>
  <text x="830" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f1630" font-weight="700">Aider a passer</text>
  <text x="830" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f1630">a l'action</text>
  <text x="500" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d2c5e">Pont entre ton offre et la bonne personne.</text>
</svg>

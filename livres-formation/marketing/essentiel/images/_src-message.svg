<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f2f8"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1f1630" font-weight="700">Message = offre + promesse + preuve</text>
<rect x="70" y="130" width="280" height="220" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="210" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1f1630" font-weight="700">Offre</text>
<text x="210" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5a4d6a" font-weight="400">ce que tu fais</text>
<rect x="360" y="130" width="280" height="220" rx="14" fill="#f3e6d8" stroke="#e8a87c" stroke-width="3"/>
<text x="500" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7a4a2a" font-weight="700">Promesse</text>
<text x="500" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7a4a2a" font-weight="400">ce que ca change</text>
<rect x="650" y="130" width="280" height="220" rx="14" fill="#3d2c5e" stroke="#3d2c5e" stroke-width="3"/>
<text x="790" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700">Preuve</text>
<text x="790" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e8a87c" font-weight="400">avis / photo / delai</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a4d6a" font-weight="400">Si une case manque, le message tremble.</text>
</svg>

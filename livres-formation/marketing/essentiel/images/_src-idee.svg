<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f2f8"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1f1630" font-weight="700">Le marketing, c'est plus que de la pub</text>
<rect x="60" y="110" width="200" height="200" rx="14" fill="#3d2c5e" stroke="#3d2c5e" stroke-width="3"/>
<text x="160" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Comprendre</text>
<text x="160" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e8a87c" font-weight="400">le besoin</text>
<rect x="280" y="110" width="200" height="200" rx="14" fill="#3d2c5e" stroke="#3d2c5e" stroke-width="3"/>
<text x="380" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Parler clair</text>
<text x="380" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e8a87c" font-weight="400">message + preuve</text>
<rect x="500" y="110" width="200" height="200" rx="14" fill="#3d2c5e" stroke="#3d2c5e" stroke-width="3"/>
<text x="600" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Etre visible</text>
<text x="600" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e8a87c" font-weight="400">canaux utiles</text>
<rect x="720" y="110" width="220" height="200" rx="14" fill="#e8a87c" stroke="#e8a87c" stroke-width="3"/>
<text x="830" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1f1630" font-weight="700">Aider a passer</text>
<text x="830" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f1630" font-weight="400">a l'action</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#5a4d6a" font-weight="400">Pont entre ton offre et la bonne personne.</text>
</svg>

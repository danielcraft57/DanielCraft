<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f6f2f8"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1f1630" font-weight="700">Plan 30 jours : 4 semaines</text>
<rect x="60" y="130" width="210" height="220" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="165" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1f1630" font-weight="700">S1</text>
<text x="165" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a4d6a" font-weight="400">fondations</text>
<text x="165" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a4d6a" font-weight="400">cible + message</text>
<rect x="290" y="130" width="210" height="220" rx="14" fill="#f3e6d8" stroke="#e8a87c" stroke-width="3"/>
<text x="395" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#7a4a2a" font-weight="700">S2</text>
<text x="395" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a4a2a" font-weight="400">contenu</text>
<text x="395" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7a4a2a" font-weight="400">+ preuve</text>
<rect x="520" y="130" width="210" height="220" rx="14" fill="#ffffff" stroke="#3d2c5e" stroke-width="3"/>
<text x="625" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1f1630" font-weight="700">S3</text>
<text x="625" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5a4d6a" font-weight="400">etre trouve</text>
<text x="625" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a4d6a" font-weight="400">Google / canaux</text>
<rect x="750" y="130" width="190" height="220" rx="14" fill="#e8a87c" stroke="#e8a87c" stroke-width="3"/>
<text x="845" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1f1630" font-weight="700">S4</text>
<text x="845" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f1630" font-weight="400">mesurer</text>
<text x="845" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f1630" font-weight="400">ajuster</text>
<text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5a4d6a" font-weight="400">Une date. Un signal. Pas quinze outils.</text>
</svg>

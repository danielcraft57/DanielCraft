<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f3f7f6"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#264653" font-weight="700">Client precis</text>
  <rect x="150" y="110" width="700" height="220" rx="16" fill="#fff" stroke="#264653" stroke-width="3"/>
  <text x="200" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e9c46a" font-weight="700">Qui ?</text>

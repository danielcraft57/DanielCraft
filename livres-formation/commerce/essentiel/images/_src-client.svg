  <text x="200" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e9c46a" font-weight="700">Probleme ?</text>
  <text x="360" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1a2a32">perd du temps admin</text>

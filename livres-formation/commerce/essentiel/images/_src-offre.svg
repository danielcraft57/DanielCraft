  <rect x="180" y="100" width="640" height="230" rx="16" fill="#fff" stroke="#264653" stroke-width="3"/>
  <text x="220" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a2a32">Pour qui + resultat</text>

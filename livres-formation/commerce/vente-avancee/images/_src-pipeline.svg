<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef3f0"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#14241e" font-weight="700">Pipeline : voir ou en est chaque opportunite</text>

  <defs>
    <marker id="ap" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1b3a2f"/>
    </marker>
  </defs>

  <rect x="25" y="95" width="145" height="210" rx="14" fill="#1b3a2f"/>
  <text x="97" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d4896a" font-weight="700">1. Contact</text>
  <text x="97" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">entree</text>
  <text x="97" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#eef3f0">piste ou lead</text>

  <line x1="180" y1="200" x2="205" y2="200" stroke="#1b3a2f" stroke-width="4" marker-end="url(#ap)"/>

  <rect x="215" y="95" width="145" height="210" rx="14" fill="#2d5a45"/>
  <text x="287" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d4896a" font-weight="700">2. Qualifier</text>
  <text x="287" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">filtre</text>
  <text x="287" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#eef3f0">budget, timing</text>

  <line x1="370" y1="200" x2="395" y2="200" stroke="#1b3a2f" stroke-width="4" marker-end="url(#ap)"/>

  <rect x="405" y="95" width="145" height="210" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>
  <text x="477" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b3a2f" font-weight="700">3. Offre</text>
  <text x="477" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#14241e" font-weight="700">proposer</text>
  <text x="477" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d5a45">valeur claire</text>

  <line x1="560" y1="200" x2="585" y2="200" stroke="#1b3a2f" stroke-width="4" marker-end="url(#ap)"/>

  <rect x="595" y="95" width="145" height="210" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>
  <text x="667" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b3a2f" font-weight="700">4. Negocier</text>
  <text x="667" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#14241e" font-weight="700">ajuster</text>
  <text x="667" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d5a45">conditions</text>

  <line x1="750" y1="200" x2="775" y2="200" stroke="#1b3a2f" stroke-width="4" marker-end="url(#ap)"/>

  <rect x="785" y="95" width="190" height="210" rx="14" fill="#d4896a" stroke="#1b3a2f" stroke-width="3"/>
  <text x="880" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#14241e" font-weight="700">5. Conclure</text>
  <text x="880" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#14241e" font-weight="700">closing</text>
  <text x="880" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1b3a2f">puis suivi</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#14241e">Un pipeline clair : tu sais ou relancer, et pourquoi.</text>
</svg>

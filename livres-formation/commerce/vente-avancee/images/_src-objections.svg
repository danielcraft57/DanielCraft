<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#eef3f0"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#14241e" font-weight="700">Objections dures : traiter sans se braquer</text>

  <defs>
    <marker id="ao" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1b3a2f"/>
    </marker>
  </defs>

  <rect x="30" y="90" width="200" height="220" rx="14" fill="#1b3a2f"/>
  <text x="130" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d4896a" font-weight="700">1. Accueillir</text>
  <text x="130" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">entendre</text>
  <text x="130" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#eef3f0">sans se defendre</text>
  <text x="130" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d4896a">prix, delai, doute</text>

  <line x1="245" y1="200" x2="280" y2="200" stroke="#1b3a2f" stroke-width="4" marker-end="url(#ao)"/>

  <rect x="290" y="90" width="200" height="220" rx="14" fill="#2d5a45"/>
  <text x="390" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d4896a" font-weight="700">2. Clarifier</text>
  <text x="390" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700">preciser</text>
  <text x="390" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#eef3f0">le vrai frein</text>
  <text x="390" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d4896a">une question</text>

  <line x1="505" y1="200" x2="540" y2="200" stroke="#1b3a2f" stroke-width="4" marker-end="url(#ao)"/>

  <rect x="550" y="90" width="200" height="220" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>
  <text x="650" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b3a2f" font-weight="700">3. Repondre</text>
  <text x="650" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#14241e" font-weight="700">preuve</text>
  <text x="650" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d5a45">faits, exemples</text>
  <text x="650" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d4896a">pas de blabla</text>

  <line x1="765" y1="200" x2="800" y2="200" stroke="#1b3a2f" stroke-width="4" marker-end="url(#ao)"/>

  <rect x="810" y="90" width="160" height="220" rx="14" fill="#d4896a" stroke="#1b3a2f" stroke-width="3"/>
  <text x="890" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#14241e" font-weight="700">4. Verifier</text>
  <text x="890" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#14241e" font-weight="700">OK ?</text>
  <text x="890" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b3a2f">lever le doute</text>
  <text x="890" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1b3a2f">puis avancer</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#14241e">L'objection n'est pas un mur : c'est une demande d'info.</text>
</svg>

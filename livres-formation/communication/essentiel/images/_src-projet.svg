<text x="700" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2a1418" font-weight="700">J7</text>
<text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b1e2a" font-weight="400">Un plan simple, pas un roman.</text>

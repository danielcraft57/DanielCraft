<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#f7f3ef"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2a1418" font-weight="700">Plan 7 jours</text>
<rect x="80" y="140" width="160" height="160" rx="14" fill="#ffffff" stroke="#6b1e2a" stroke-width="3"/>
<text x="160" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2a1418" font-weight="700">J1-2</text>
<rect x="260" y="140" width="160" height="160" rx="14" fill="#f0e4d8" stroke="#6b1e2a" stroke-width="3"/>
<text x="340" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2a1418" font-weight="700">J3-4</text>
<rect x="440" y="140" width="160" height="160" rx="14" fill="#ffffff" stroke="#6b1e2a" stroke-width="3"/>
<text x="520" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2a1418" font-weight="700">J5-6</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f7f3ef"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2a1418" font-weight="700">Ecoute active : comprendre d'abord</text>
  <rect x="60" y="100" width="200" height="120" rx="14" fill="#6b1e2a"/>
  <text x="160" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">1. Accueillir</text>
  <text x="160" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d4a574">"Je t'ecoute"</text>
  <rect x="287" y="100" width="200" height="120" rx="14" fill="#8a2f3d"/>
  <text x="387" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">2. Clarifier</text>
  <text x="387" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d4a574">une question</text>
  <rect x="514" y="100" width="200" height="120" rx="14" fill="#6b1e2a"/>
  <text x="614" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">3. Reformuler</text>
  <text x="614" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d4a574">une phrase</text>
  <rect x="741" y="100" width="200" height="120" rx="14" fill="#d4a574"/>
  <text x="841" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2a1418" font-weight="700">4. Proposer</text>
  <text x="841" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2a1418">une suite</text>
  <rect x="150" y="270" width="700" height="70" rx="12" fill="#ebe3db"/>
  <text x="500" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b1e2a">Ecouter pour comprendre, pas seulement pour repondre.</text>
</svg>

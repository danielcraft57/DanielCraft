  <rect x="745" y="100" width="210" height="150" rx="14" fill="#d4a574"/>
  <text x="850" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2a1418" font-weight="700">Transparence</text>

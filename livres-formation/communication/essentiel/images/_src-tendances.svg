  <rect x="55" y="100" width="210" height="150" rx="14" fill="#6b1e2a"/>
  <text x="160" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Authenticite</text>
  <text x="160" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d4a574">parler vrai</text>
  <rect x="285" y="100" width="210" height="150" rx="14" fill="#8a2f3d"/>
  <text x="390" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Video courte</text>
  <text x="390" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d4a574">une idee nette</text>
  <rect x="515" y="100" width="210" height="150" rx="14" fill="#6b1e2a"/>
  <text x="620" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">IA brouillon</text>

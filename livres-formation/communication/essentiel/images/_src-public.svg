  <text x="835" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#fff" font-weight="700">Action</text>
  <text x="835" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d4a574">signer / venir</text>
  <line x1="260" y1="154" x2="430" y2="185" stroke="#6b1e2a" stroke-width="2"/>
  <line x1="740" y1="154" x2="570" y2="185" stroke="#6b1e2a" stroke-width="2"/>

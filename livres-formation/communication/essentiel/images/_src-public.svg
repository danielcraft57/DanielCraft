<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#f7f3ef"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2a1418" font-weight="700">Public et destinataires</text>
<rect x="150" y="120" width="700" height="220" rx="14" fill="#ffffff" stroke="#6b1e2a" stroke-width="3"/>
<text x="500" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#2a1418" font-weight="700">a qui tu parles</text>
<text x="500" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b1e2a" font-weight="400">ce qu'ils savent deja</text>
<text x="500" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b1e2a" font-weight="400">ce qu'ils doivent faire</text>
<text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b1e2a" font-weight="400">Adapter le message, pas le copier.</text>
</svg>

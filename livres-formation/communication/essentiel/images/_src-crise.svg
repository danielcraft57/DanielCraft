<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f7f3ef"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2a1418" font-weight="700">En crise : trois piliers</text>
  <rect x="70" y="100" width="270" height="180" rx="16" fill="#6b1e2a"/>
  <text x="205" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fff" font-weight="700">Faits</text>
  <text x="205" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d4a574">ce qu'on sait</text>
  <text x="205" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d4a574">sans speculation</text>
  <rect x="365" y="100" width="270" height="180" rx="16" fill="#8a2f3d"/>
  <text x="500" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fff" font-weight="700">Empathie</text>
  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d4a574">impact sur</text>
  <text x="500" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d4a574">les personnes</text>
  <rect x="660" y="100" width="270" height="180" rx="16" fill="#d4a574"/>
  <text x="795" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#2a1418" font-weight="700">Action</text>
  <text x="795" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2a1418">ce qu'on fait</text>
  <text x="795" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2a1418">+ prochaine info</text>
  <text x="500" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b1e2a">Calme. Honnete. Une voix principale.</text>

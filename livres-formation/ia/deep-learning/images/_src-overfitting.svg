<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#f7f4ef"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a4d3e" font-weight="700">Overfitting : coller au train, rater le neuf</text>

  <rect x="80" y="120" width="380" height="300" rx="16" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="270" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a4d3e" font-weight="700">Train</text>
  <text x="270" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248">accuracy haute</text>
  <text x="270" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248">le modele recite</text>
  <circle cx="180" cy="340" r="18" fill="#1a4d3e"/>
  <circle cx="240" cy="320" r="18" fill="#1a4d3e"/>
  <circle cx="300" cy="350" r="18" fill="#1a4d3e"/>
  <circle cx="360" cy="330" r="18" fill="#1a4d3e"/>

  <rect x="540" y="120" width="380" height="300" rx="16" fill="#fff4d6" stroke="#c9a227" stroke-width="3"/>
  <text x="730" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a6410" font-weight="700">Validation</text>
  <text x="730" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410">score qui baisse</text>
  <text x="730" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410">cas nouveaux rates</text>
  <circle cx="640" cy="340" r="18" fill="#c9a227" opacity="0.45"/>
  <circle cx="720" cy="320" r="18" fill="#c9a227" opacity="0.45"/>
  <circle cx="800" cy="350" r="18" fill="#c9a227" opacity="0.45"/>

  <text x="500" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3d5248">Remedes : donnees, regularisation, early stopping, transfer</text>

</svg>

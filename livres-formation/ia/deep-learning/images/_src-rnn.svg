<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#f5f7fb"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0b1b33" font-weight="700">RNN : memoire pas a pas</text>
<rect x="100" y="140" width="200" height="160" rx="6" fill="#ffffff" stroke="#0b1b33" stroke-width="3"/>
<text x="200" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0b1b33" font-weight="700">t-1</text>
<rect x="360" y="140" width="200" height="160" rx="6" fill="#e8edf5" stroke="#0b1b33" stroke-width="3"/>
<text x="460" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0b1b33" font-weight="700">t</text>
<rect x="620" y="140" width="200" height="160" rx="6" fill="#ff7a59" stroke="#0b1b33" stroke-width="3"/>
<text x="720" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0b1b33" font-weight="700">t+1</text>
<text x="500" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64748b" font-weight="400">Un etat avance dans la sequence.</text>
</svg>

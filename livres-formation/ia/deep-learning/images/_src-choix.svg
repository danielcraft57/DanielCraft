<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#f7f4ef"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a4d3e" font-weight="700">Choisir une architecture : matcher le probleme</text>

  <rect x="50" y="110" width="280" height="120" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="190" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e" font-weight="700">Petit tableau</text>
  <text x="190" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3d5248">ML classique d'abord</text>

  <rect x="360" y="110" width="280" height="120" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="500" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e" font-weight="700">Images</text>
  <text x="500" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3d5248">CNN / vision + transfer</text>

  <rect x="670" y="110" width="280" height="120" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="810" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e" font-weight="700">Texte generation</text>
  <text x="810" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3d5248">LLM + prompt / RAG</text>

  <rect x="200" y="280" width="280" height="120" rx="14" fill="#fff4d6" stroke="#c9a227" stroke-width="3"/>
  <text x="340" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410" font-weight="700">Series temporelles</text>
  <text x="340" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7a6410">specialise / mixte</text>

  <rect x="520" y="280" width="280" height="120" rx="14" fill="#fff4d6" stroke="#c9a227" stroke-width="3"/>
  <text x="660" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410" font-weight="700">Audio</text>
  <text x="660" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7a6410">modeles parole</text>

  <text x="500" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3d5248">L'architecture suit le probleme, jamais l'inverse</text>


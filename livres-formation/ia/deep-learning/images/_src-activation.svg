<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#f7f4ef"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a4d3e" font-weight="700">Activation : introduire du non-lineaire</text>

  <rect x="80" y="140" width="260" height="260" rx="16" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="210" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a4d3e" font-weight="700">Score brut</text>
  <text x="210" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248">somme ponderee</text>
  <text x="210" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248">+ biais</text>

  <rect x="390" y="200" width="220" height="140" rx="16" fill="#fff4d6" stroke="#c9a227" stroke-width="3"/>
  <text x="500" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7a6410" font-weight="700">Activation</text>
  <text x="500" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7a6410">ReLU / Softmax...</text>

  <rect x="660" y="140" width="260" height="260" rx="16" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="790" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a4d3e" font-weight="700">Signal utile</text>
  <text x="790" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248">coupe / ecrase</text>
  <text x="790" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248">ou distribue</text>

  <text x="500" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5248">Sans non-linearite, plusieurs couches = encore lineaire</text>


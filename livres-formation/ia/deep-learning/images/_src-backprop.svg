<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#f7f4ef"/>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#1a4d3e" font-weight="700">Backprop : ajuster les poids</text>

  <rect x="60" y="130" width="160" height="100" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="140" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e" font-weight="700">1. Batch</text>

  <rect x="260" y="130" width="160" height="100" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="340" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e" font-weight="700">2. Avant</text>

  <rect x="460" y="130" width="160" height="100" rx="14" fill="#fff4d6" stroke="#c9a227" stroke-width="3"/>
  <text x="540" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410" font-weight="700">3. Perte</text>

  <rect x="660" y="130" width="160" height="100" rx="14" fill="#fff4d6" stroke="#c9a227" stroke-width="3"/>
  <text x="740" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7a6410" font-weight="700">4. Arriere</text>

  <rect x="300" y="300" width="200" height="100" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="400" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e" font-weight="700">5. Maj poids</text>

  <rect x="540" y="300" width="200" height="100" rx="14" fill="#e8f3ee" stroke="#1a4d3e" stroke-width="3"/>
  <text x="640" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a4d3e" font-weight="700">6. Repeter</text>

  <text x="500" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3d5248">Comme descendre une colline : petits pas selon la pente</text>

</svg>

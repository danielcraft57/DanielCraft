<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f1f5f9"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="700">Outils du quotidien : quatre gestes utiles</text>

  <rect x="30" y="90" width="220" height="210" rx="14" fill="#111827"/>
  <text x="140" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7dd3fc" font-weight="700">Ecrire</text>
  <text x="140" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">brouillon</text>
  <text x="140" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">mail, plan,</text>
  <text x="140" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">reformuler</text>

  <rect x="270" y="90" width="220" height="210" rx="14" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="380" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827" font-weight="700">Resumer</text>
  <text x="380" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="700">essentiel</text>
  <text x="380" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">long texte</text>
  <text x="380" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">en points</text>

  <rect x="510" y="90" width="220" height="210" rx="14" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="620" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827" font-weight="700">Ideer</text>
  <text x="620" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="700">pistes</text>
  <text x="620" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">titres,</text>
  <text x="620" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">variantes</text>

  <rect x="750" y="90" width="220" height="210" rx="14" fill="#7dd3fc" stroke="#111827" stroke-width="3"/>
  <text x="860" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700">Expliquer</text>
  <text x="860" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="700">simplifier</text>
  <text x="860" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">pour un public</text>
  <text x="860" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">precis</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0f172a">Des outils pour gagner du temps sur le brouillon, pas pour remplacer ton jugement.</text>
</svg>

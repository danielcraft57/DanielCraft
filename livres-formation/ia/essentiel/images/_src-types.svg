<rect x="70" y="110" width="200" height="200" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<text x="170" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Classer</text>
<text x="170" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">detecter</text>
<rect x="290" y="110" width="200" height="200" rx="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
<text x="390" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Predire</text>
<text x="390" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">estimer</text>

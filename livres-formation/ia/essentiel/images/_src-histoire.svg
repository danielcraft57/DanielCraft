<text x="225" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Avant</text>
<text x="225" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">regles fixes</text>
<rect x="375" y="120" width="250" height="180" rx="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
<text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700">Apprentissage</text>

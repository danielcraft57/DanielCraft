<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f1f5f9"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="700">Humain, modele, reponse</text>

  <defs>
    <marker id="al" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111827"/>
    </marker>
    <marker id="al2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0369a1"/>
    </marker>
  </defs>

  <rect x="40" y="100" width="240" height="200" rx="16" fill="#111827"/>
  <circle cx="160" cy="160" r="32" fill="#7dd3fc"/>
  <text x="160" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#111827" font-weight="700">Toi</text>
  <text x="160" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Humain</text>
  <text x="160" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dd3fc">question, besoin</text>

  <line x1="300" y1="180" x2="370" y2="180" stroke="#111827" stroke-width="4" marker-end="url(#al)"/>
  <text x="335" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827" font-weight="700">demande</text>

  <rect x="380" y="100" width="240" height="200" rx="16" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <rect x="420" y="140" width="160" height="50" rx="10" fill="#111827"/>
  <text x="500" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7dd3fc" font-weight="700">Modele</text>
  <text x="500" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700">calcule</text>
  <text x="500" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">propose une suite</text>

  <line x1="640" y1="220" x2="710" y2="220" stroke="#0369a1" stroke-width="4" marker-end="url(#al2)"/>
  <text x="675" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0369a1" font-weight="700">sortie</text>

  <rect x="720" y="100" width="240" height="200" rx="16" fill="#7dd3fc" stroke="#111827" stroke-width="3"/>
  <text x="840" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700">Reponse</text>
  <text x="840" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">texte propose</text>
  <text x="840" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">a lire et verifier</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0f172a">Tu poses une question, le modele propose, tu decides.</text>
</svg>

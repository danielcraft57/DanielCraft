<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#f8fafc"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0b1220" font-weight="700">Atelier regression</text>
<rect x="100" y="140" width="240" height="200" rx="6" fill="#ffffff" stroke="#0b1220" stroke-width="3"/>
<text x="220" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0b1220" font-weight="700">1. Donnees</text>
<text x="220" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">X + y nombre</text>
<rect x="380" y="140" width="240" height="200" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
<text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f766e" font-weight="700">2. Modele</text>
<text x="500" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f766e" font-weight="400">simple d'abord</text>
<rect x="660" y="140" width="240" height="200" rx="6" fill="#ffffff" stroke="#0b1220" stroke-width="3"/>
<text x="780" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0b1220" font-weight="700">3. Mesure</text>
<text x="780" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">MAE / RMSE</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">But : une prediction numerique utile, pas un score magique.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#f8fafc"/>
<text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0b1220" font-weight="700">Bonnes pratiques</text>
<rect x="80" y="130" width="400" height="100" rx="6" fill="#ffffff" stroke="#0b1220" stroke-width="3"/>
<text x="280" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0b1220" font-weight="700">Baseline avant le fancy</text>
<rect x="520" y="130" width="400" height="100" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
<text x="720" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f766e" font-weight="700">Documenter les limites</text>
<rect x="80" y="270" width="400" height="100" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
<text x="280" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f766e" font-weight="700">Mesurer par sous-groupe</text>
<rect x="520" y="270" width="400" height="100" rx="6" fill="#ffffff" stroke="#0b1220" stroke-width="3"/>
<text x="720" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0b1220" font-weight="700">Humain si doute</text>
<text x="500" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">Sobriete, honnetete, surveillance : mieux que le jargon.</text>
</svg>

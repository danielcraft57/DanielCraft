<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#eef3f0"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1b3a2f" font-weight="700">Mini-projet : plan sur papier</text>
<rect x="70" y="110" width="200" height="200" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>
<text x="170" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1b3a2f" font-weight="700">1. Poches</text>
<text x="170" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d5a45" font-weight="400">A / B / C</text>
<rect x="290" y="110" width="200" height="200" rx="14" fill="#dce8e1" stroke="#1b3a2f" stroke-width="3"/>
<text x="390" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="700">2. Enveloppe</text>
<text x="390" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d5a45" font-weight="400">PEA / CTO</text>
<rect x="510" y="110" width="200" height="200" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>
<text x="610" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="700">3. Allocation</text>
<text x="610" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d5a45" font-weight="400">+ duration</text>
<rect x="730" y="110" width="200" height="200" rx="14" fill="#d4896a" stroke="#1b3a2f" stroke-width="3"/>
<text x="830" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1b3a2f" font-weight="700">4. Chocs</text>
<text x="830" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b3a2f" font-weight="400">-20 % / +1 %</text>
<text x="500" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d5a45" font-weight="400">Simuler avant de vivre.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#eef3f0"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1b3a2f" font-weight="700">PER, payout, dividende</text>
<rect x="70" y="110" width="280" height="200" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>
<text x="210" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1b3a2f" font-weight="700">PER</text>
<text x="210" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">Prix / BPA</text>
<text x="210" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2d5a45" font-weight="400">ex. 40 / 4 = 10</text>
<rect x="370" y="110" width="280" height="200" rx="14" fill="#dce8e1" stroke="#1b3a2f" stroke-width="3"/>
<text x="510" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1b3a2f" font-weight="700">Payout</text>
<text x="510" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">Div / BPA</text>
<text x="510" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2d5a45" font-weight="400">part redistribuee</text>
<rect x="670" y="110" width="260" height="200" rx="14" fill="#d4896a" stroke="#1b3a2f" stroke-width="3"/>
<text x="800" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Rendement</text>
<text x="800" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">Div / Prix</text>
<text x="800" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b3a2f" font-weight="400">pas une assurance</text>
<text x="500" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d5a45" font-weight="400">Un ratio seul ne decide pas.</text>
</svg>

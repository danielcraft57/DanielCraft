<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#eef3f0"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1b3a2f" font-weight="700">Marches : primaire et secondaire</text>
<rect x="80" y="100" width="260" height="220" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>
<text x="210" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Primaire</text>
<text x="210" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">emission</text>
<text x="210" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2d5a45" font-weight="400">argent -> emetteur</text>
<rect x="370" y="100" width="260" height="220" rx="14" fill="#dce8e1" stroke="#1b3a2f" stroke-width="3"/>
<text x="500" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Secondaire</text>
<text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">echange</text>
<text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d5a45" font-weight="400">investisseur <-> investisseur</text>
<rect x="660" y="100" width="260" height="220" rx="14" fill="#d4896a" stroke="#1b3a2f" stroke-width="3"/>
<text x="790" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Volatilite</text>
<text x="790" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">prix qui bouge</text>
<text x="790" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b3a2f" font-weight="400">horizon = cle</text>
<text x="500" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d5a45" font-weight="400">Comprendre la scene avant de cliquer.</text>
</svg>

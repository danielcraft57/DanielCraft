<rect x="80" y="120" width="260" height="200" rx="14" fill="#dce8e1" stroke="#1b3a2f" stroke-width="3"/>
<text x="210" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Actions</text>
<text x="210" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d5a45" font-weight="400">ex. 60 %</text>
<rect x="370" y="120" width="260" height="200" rx="14" fill="#ffffff" stroke="#1b3a2f" stroke-width="3"/>

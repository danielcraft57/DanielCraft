<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f0f5f2"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0c1f17" font-weight="700">Tresorerie : l'argent disponible maintenant</text>

  <defs>
    <marker id="at" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#14532d"/>
    </marker>
  </defs>

  <rect x="30" y="95" width="200" height="210" rx="14" fill="#14532d"/>
  <text x="130" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#c9a227" font-weight="700">1. Facturer</text>
  <text x="130" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">travail fait</text>
  <text x="130" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f0f5f2">devis, facture</text>

  <line x1="245" y1="200" x2="280" y2="200" stroke="#14532d" stroke-width="4" marker-end="url(#at)"/>

  <rect x="290" y="95" width="200" height="210" rx="14" fill="#166534"/>
  <text x="390" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#c9a227" font-weight="700">2. Attendre</text>
  <text x="390" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">delai client</text>
  <text x="390" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f0f5f2">30, 45, 60 jours</text>

  <line x1="505" y1="200" x2="540" y2="200" stroke="#14532d" stroke-width="4" marker-end="url(#at)"/>

  <rect x="550" y="95" width="200" height="210" rx="14" fill="#ffffff" stroke="#14532d" stroke-width="3"/>
  <text x="650" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="700">3. Encaisser</text>
  <text x="650" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0c1f17" font-weight="700">sur le compte</text>
  <text x="650" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#166534">vrai argent</text>

  <line x1="765" y1="200" x2="800" y2="200" stroke="#14532d" stroke-width="4" marker-end="url(#at)"/>

  <rect x="810" y="95" width="160" height="210" rx="14" fill="#c9a227" stroke="#14532d" stroke-width="3"/>
  <text x="890" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0c1f17" font-weight="700">4. Payer</text>
  <text x="890" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0c1f17" font-weight="700">fournisseurs</text>
  <text x="890" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#14532d">charges, toi</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0c1f17">Chiffre d'affaires haut + compte vide : c'est souvent la tresorerie.</text>
</svg>

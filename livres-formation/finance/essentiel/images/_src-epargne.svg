<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f0f5f2"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0c1f17" font-weight="700">Epargne : d'abord le coussin, puis le projet</text>

  <defs>
    <marker id="ae" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#14532d"/>
    </marker>
  </defs>

  <rect x="40" y="100" width="250" height="200" rx="16" fill="#14532d"/>
  <text x="165" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c9a227" font-weight="700">1. Prelever</text>
  <text x="165" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">d'abord</text>
  <text x="165" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f0f5f2">avant le reste</text>

  <line x1="310" y1="200" x2="360" y2="200" stroke="#14532d" stroke-width="4" marker-end="url(#ae)"/>

  <rect x="370" y="100" width="250" height="200" rx="16" fill="#ffffff" stroke="#14532d" stroke-width="3"/>
  <text x="495" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#14532d" font-weight="700">2. Coussin</text>
  <text x="495" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0c1f17" font-weight="700">urgence</text>
  <text x="495" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">quelques mois</text>

  <line x1="640" y1="200" x2="690" y2="200" stroke="#14532d" stroke-width="4" marker-end="url(#ae)"/>

  <rect x="700" y="100" width="260" height="200" rx="16" fill="#c9a227" stroke="#14532d" stroke-width="3"/>
  <text x="830" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0c1f17" font-weight="700">3. Projet</text>
  <text x="830" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0c1f17" font-weight="700">objectif</text>
  <text x="830" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#14532d">outil, voyage...</text>

  <text x="500" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0c1f17">Mettre de cote n'est pas un luxe : c'est une protection.</text>
</svg>

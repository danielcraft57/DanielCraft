<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#eef3f0"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1b3a2f" font-weight="700">Couverture vs speculation</text>
<rect x="100" y="120" width="350" height="200" rx="14" fill="#dce8e1" stroke="#1b3a2f" stroke-width="3"/>
<text x="275" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Couverture</text>
<text x="275" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">reduit un risque</text>
<text x="275" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d5a45" font-weight="400">deja present</text>
<rect x="550" y="120" width="350" height="200" rx="14" fill="#d4896a" stroke="#1b3a2f" stroke-width="3"/>
<text x="725" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Speculation</text>
<text x="725" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">prend un risque</text>
<text x="725" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">pour un gain vise</text>
<text x="500" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d5a45" font-weight="400">Meme outil, intention differente.</text>
</svg>

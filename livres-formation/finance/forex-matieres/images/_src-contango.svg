<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#eef3f0"/>
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1b3a2f" font-weight="700">Contango et backwardation</text>
<rect x="100" y="110" width="380" height="200" rx="14" fill="#dce8e1" stroke="#1b3a2f" stroke-width="3"/>
<text x="290" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1b3a2f" font-weight="700">Contango</text>
<text x="290" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">lointain > proche</text>
<text x="290" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2d5a45" font-weight="400">roll parfois couteux</text>
<rect x="520" y="110" width="380" height="200" rx="14" fill="#d4896a" stroke="#1b3a2f" stroke-width="3"/>
<text x="710" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1b3a2f" font-weight="700">Backwardation</text>
<text x="710" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1b3a2f" font-weight="400">proche > lointain</text>
<text x="710" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b3a2f" font-weight="400">tension sur le spot</text>
<text x="500" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2d5a45" font-weight="400">Lis la courbe avant un ETF futures.</text>
